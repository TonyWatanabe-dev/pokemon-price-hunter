<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Hit GSAP</title>
<!-- Camada de vídeo 9:16 (layout aprovado pelo dono em 31/10): placar no topo, estrela HIT, faixa da carta embaixo e
     lâmina final escura na cor do tipo da carta. Cores e fonte do design system TCG Price Hunter; zona segura 250–1620 px. -->
<style>
@font-face{font-family:Rubik;font-weight:500;src:url(rubik500.ttf)}
@font-face{font-family:Rubik;font-weight:700;src:url(rubik700.ttf)}
@font-face{font-family:Rubik;font-weight:800;src:url(rubik800.ttf)}
@font-face{font-family:Rubik;font-weight:900;src:url(rubik900.ttf)}
:root{--am:#ffcf33;--vm:#ff3b3b;--vd:#2ee36b;--az:#0d1430;--az2:#18224d;--br:#fff;--ty:#18224d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:Rubik,sans-serif;color:var(--br);font-variant-numeric:tabular-nums}
#palco{position:absolute;inset:0;overflow:hidden}

/* placar */
#placar{position:absolute;top:262px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
#placar .rot{font:800 30px Rubik;letter-spacing:.14em;text-transform:uppercase;background:rgba(13,20,48,.82);padding:8px 22px;border-radius:999px;color:var(--am)}
#placar .val{position:relative;overflow:hidden;font:900 92px Rubik;padding:10px 40px 14px;border-radius:28px;background:rgba(10,12,24,.88);border:6px solid var(--vm);color:var(--vm);box-shadow:0 14px 40px rgba(0,0,0,.45);white-space:nowrap}

/* gancho */
#gancho{position:absolute;left:60px;right:60px;bottom:420px;padding:34px 40px 40px;border-radius:40px;background:rgba(13,20,48,.9);border:5px solid var(--am);box-shadow:0 20px 60px rgba(0,0,0,.5)}
#gancho img{height:96px;display:block;margin-bottom:22px}
#gancho .kick{font:800 34px Rubik;color:var(--am);letter-spacing:.06em;text-transform:uppercase}
#gancho .tit{font:900 76px/1.02 Rubik;margin-top:10px}
#gancho .tit em{font-style:normal;color:var(--am)}

/* hit */
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#aneis{position:absolute;left:0;top:0;width:1080px;height:1920px}
.anel{opacity:0}
#hit{position:absolute;top:560px;right:40px;width:330px;height:330px;transform:scale(0)}
#hit .estrela{position:absolute;inset:0;background:var(--am);clip-path:polygon(50% 0,61% 22%,85% 9%,80% 35%,100% 44%,80% 58%,93% 82%,66% 77%,55% 100%,42% 79%,17% 92%,20% 66%,0 55%,19% 41%,8% 16%,34% 22%)}
#hit span{position:absolute;inset:0;display:grid;place-items:center;font:900 92px Rubik;color:var(--az);transform:rotate(-10deg)}
#faixa{position:absolute;left:50px;right:50px;bottom:400px;border-radius:36px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55);opacity:0}
#faixa .topo{background:var(--am);color:var(--az);font:900 30px Rubik;letter-spacing:.12em;text-transform:uppercase;padding:14px 36px}
#faixa .corpo{background:rgba(13,20,48,.94);padding:24px 36px 30px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
#faixa .nome{font:900 60px/1.02 Rubik;white-space:nowrap}
#faixa .preco{font:900 64px Rubik;color:var(--vd);white-space:nowrap}
#faixa .fonte{font:500 24px Rubik;color:#9aa6d8;padding:0 36px 20px;background:rgba(13,20,48,.94)}
.sheen{position:absolute;top:-40%;bottom:-40%;width:34%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg);pointer-events:none}
.brilho{position:absolute;width:70px;height:70px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:0}

/* máscara de palavras */
.mask{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .12em;margin:0 -.04em -.12em}
.mask > span{display:inline-block}

/* lâmina final: cor do tipo da carta */
#fim{position:absolute;inset:0;background:linear-gradient(170deg,var(--ty),color-mix(in srgb,var(--ty) 55%,#05060c) 75%);padding:250px 80px 300px;display:flex;flex-direction:column;align-items:flex-start;clip-path:circle(0px at 540px 900px)}
#fim .marca{position:absolute;right:-120px;top:180px;width:620px;height:620px;opacity:.12;fill:#fff}
#fim > *{flex-shrink:0}
#fim .logo{height:110px;display:block;margin-bottom:56px;position:relative}
#fim .tag{font:800 32px Rubik;color:var(--vd);letter-spacing:.12em;text-transform:uppercase;position:relative}
#fim h1{font:900 132px/1 Rubik;margin-top:18px;position:relative}
#fim .lucro{font:900 132px/1 Rubik;color:var(--vd);margin-top:6px;position:relative}
#fim .linhas{align-self:stretch;margin-top:56px;border-top:3px solid rgba(255,255,255,.14);position:relative}
#fim .lin{display:flex;justify-content:space-between;gap:30px;font:700 40px Rubik;padding:26px 0;border-bottom:3px solid rgba(255,255,255,.14)}
#fim .lin small{display:block;font:500 28px Rubik;color:#b9c2ea;margin-top:6px}
#fim .lin b{font-weight:900;white-space:nowrap}
#fim .lin b.neg{color:var(--vm)} #fim .lin b.pos{color:var(--vd)}
#fim h2{font:900 92px/1.05 Rubik;margin-top:auto;position:relative}
#fim h2 em{font-style:normal;color:var(--am)}
#fim p{font:500 40px Rubik;color:#d3d9f5;margin-top:16px;position:relative}
#fim .cta{position:relative;overflow:hidden;margin-top:44px;white-space:nowrap;background:var(--am);color:var(--az);font:900 36px Rubik;padding:30px 40px;border-radius:999px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
#fim .perfil{font:700 34px Rubik;color:#b9c2ea;margin-top:34px;position:relative}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-t-planta" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 20C4 10 10 4 20 4c0 10-6 16-16 16Zm2.2-1.8 8.6-8.6-1.4-1.4-8.6 8.6Z"/></symbol>
  <symbol id="i-t-fogo" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 1.8c2 4.2 6.8 6.4 6.8 12.4a6.8 6.8 0 0 1-13.6 0c0-3.6 2.4-5 2.8-8 1.8 1.6 2.4 3.4 2.6 5 1.8-2.6 2.2-6 1.4-9.4Z"/></symbol>
  <symbol id="i-t-agua" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 1.6c3.4 5.2 7.4 9 7.4 13.2a7.4 7.4 0 0 1-14.8 0C4.6 10.6 8.6 6.8 12 1.6Zm-3.6 13a3.8 3.8 0 0 0 3.6 3.8v-1.8a2 2 0 0 1-1.8-2Z"/></symbol>
  <symbol id="i-t-eletrico" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M13.6 1.6 3.8 13.8h7l-1.2 8.6 10.6-13h-7.2Z"/></symbol>
  <symbol id="i-t-psiquico" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M1.6 12C5.8 4.6 18.2 4.6 22.4 12 18.2 19.4 5.8 19.4 1.6 12Zm10.4 4.2a4.2 4.2 0 1 0 0-8.4 4.2 4.2 0 0 0 0 8.4Zm0-2.4a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6Z"/></symbol>
  <symbol id="i-t-lutador" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 1.5 14.4 7.6 20.9 6.5 16.9 11.7 21.3 16.6 14.8 16.4 12 22.5 9.2 16.4 2.7 16.6 7.1 11.7 3.1 6.5 9.6 7.6Z"/></symbol>
  <symbol id="i-t-escuridao" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M14.6 2.4a9.8 9.8 0 1 0 7 12.6A7.8 7.8 0 1 1 14.6 2.4Z"/></symbol>
  <symbol id="i-t-metal" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 1.8 20.8 6.9v10.2L12 22.2 3.2 17.1V6.9Zm0 6.6a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2Z"/></symbol>
  <symbol id="i-t-dragao" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 3h3.2l-1 18H3Zm6.4-1h3.4l-1.6 20H9.2Zm6.6 1h3.4L18 21h-3Z"/></symbol>
  <symbol id="i-t-fada" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 1.5c.9 5.3 2.9 7.6 8.5 8.5-5.6.9-7.6 3.2-8.5 8.5-.9-5.3-2.9-7.6-8.5-8.5 5.6-.9 7.6-3.2 8.5-8.5Zm6.5 14.5c.4 2.2 1.2 3.1 3.5 3.5-2.3.4-3.1 1.3-3.5 3.5-.4-2.2-1.2-3.1-3.5-3.5 2.3-.4 3.1-1.3 3.5-3.5Z"/></symbol>
  <symbol id="i-t-incolor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M10.8 1.8h2.4v7.3l6.3-3.6 1.2 2.1-6.3 3.6 6.3 3.6-1.2 2.1-6.3-3.6v7.3h-2.4v-7.3l-6.3 3.6-1.2-2.1 6.3-3.6L3.3 7.6l1.2-2.1 6.3 3.6Z"/></symbol>
</svg>
<div id="palco">
  <div id="flash"></div>
  <svg id="aneis" viewBox="0 0 1080 1920" aria-hidden="true"><g fill="none" stroke="#fff"><circle class="anel" cx="540" cy="900" r="160" stroke-width="8"/><circle class="anel" cx="540" cy="900" r="160" stroke-width="5"/><circle class="anel" cx="540" cy="900" r="160" stroke-width="3"/></g></svg>
  <div id="placar"><div class="rot" id="placarRot"></div><div class="val" id="placarVal"><span id="placarTxt"></span><i class="sheen" id="sheenPlacar"></i></div></div>
  <div id="gancho"><img src="logo.png" alt=""><div class="kick" id="kick"></div><div class="tit" id="tit"></div></div>
  <div id="hit"><div class="estrela"></div><span>HIT!</span></div>
  <div id="faixa"><i class="sheen" id="sheenFaixa"></i><div class="topo" id="raridade"></div><div class="corpo"><div class="nome" id="nome"></div><div class="preco" id="preco"></div></div><div class="fonte" id="fonte"></div></div>
  <div id="fim">
    <svg class="marca" viewBox="0 0 24 24" aria-hidden="true"><use id="marcaTipo" href="#i-t-escuridao"/></svg>
    <img class="logo" src="logo.png" alt="">
    <div class="tag" id="fimTag"></div>
    <h1 id="fimH1">Deu lucro!</h1>
    <div class="lucro" id="fimLucro"></div>
    <div class="linhas" id="fimLinhas"></div>
    <h2 id="fimH2">Não rasgue <em>dinheiro.</em></h2>
    <p>O grupo avisa quando o preço cai.</p>
    <div class="cta"><i class="sheen" id="sheenCta"></i>Entre no grupo · tcgpricehunter.com.br</div>
    <div class="perfil">@tcgpricehunter151</div>
  </div>
</div>
<script src="gsap.min.js"></script>
<script>
const C = window.CFG || {};
const fmt = (v) => Math.abs(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const brl = (v) => (v < 0 ? '−' : '+') + 'R$ ' + fmt(v);
const reais = (v) => 'R$ ' + fmt(v);
const $ = (id) => document.getElementById(id);
const COR = { planta: '#2f9a55', fogo: '#e0512b', agua: '#2c7be5', eletrico: '#a8801a', psiquico: '#8e4bd6', lutador: '#c25a1c', escuridao: '#2b2d42', metal: '#6e7a90', dragao: '#a8801a', fada: '#e05aa0', incolor: '#556079' };
$('placarRot').textContent = C.rotulo; $('placarTxt').textContent = brl(-C.pack);
$('kick').textContent = C.kick; $('tit').innerHTML = C.titulo;
$('raridade').textContent = C.raridade; $('nome').textContent = C.carta; $('preco').textContent = reais(C.valor);
$('fonte').textContent = 'média de venda dos últimos 3 meses · Liga Pokémon';
$('fimTag').textContent = C.tagFim; $('fimLucro').textContent = brl(C.valor - C.pack);
$('fimLinhas').innerHTML = `<div class="lin"><span>${C.linhaPack}<small>${C.notaPack}</small></span><b class="neg">${brl(-C.pack)}</b></div>`
  + `<div class="lin"><span>${C.carta}<small>média Liga Pokémon</small></span><b class="pos">${brl(C.valor)}</b></div>`;
// lâmina final na cor do tipo da carta (sem tipo, ex. Treinador: navy da marca)
if (C.tipoCarta) { document.documentElement.style.setProperty('--ty', COR[C.tipoCarta]); $('marcaTipo').setAttribute('href', '#i-t-' + C.tipoCarta); } else { $('fim').querySelector('.marca').remove(); }

const brilhos = [];
for (let i = 0; i < 14; i++) { const b = document.createElement('div'); b.className = 'brilho'; $('palco').insertBefore(b, $('fim')); brilhos.push(b); }
const dividir = (el) => {
  const walk = (n) => [...n.childNodes].forEach((c) => {
    if (c.nodeType === 3) {
      const f = document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach((w) => { if (!w) return; if (/^\s+$/.test(w)) { f.append(' '); return; } const m = document.createElement('span'); m.className = 'mask'; const i = document.createElement('span'); i.textContent = w; m.append(i); f.append(m); });
      c.replaceWith(f);
    } else if (c.nodeType === 1 && c.tagName !== 'BR') walk(c);
  });
  walk(el); return el.querySelectorAll('.mask > span');
};
const wTit = dividir($('tit')), wH1 = dividir($('fimH1')), wH2 = dividir($('fimH2'));

const H = C.hitT, D = C.dur, F = D - C.fimDur, G = C.ganchoAte;
const tl = gsap.timeline({ paused: true, defaults: { ease: 'expo.out' } });
// 1. abertura
tl.from('#placar', { y: -220, opacity: 0, duration: 1, ease: 'elastic.out(1, .6)' }, .1)
  .fromTo('#sheenPlacar', { left: '-60%' }, { left: '140%', duration: .9, ease: 'power2.inOut' }, .9)
  .fromTo('#gancho', { clipPath: 'inset(100% 0% 0% 0% round 40px)', y: 60 }, { clipPath: 'inset(0% 0% 0% 0% round 40px)', y: 0, duration: .9 }, .3)
  .from('#gancho img, #gancho .kick', { y: 30, opacity: 0, duration: .7, stagger: .08 }, .55)
  .from(wTit, { yPercent: 115, rotation: 6, duration: .9, stagger: .06 }, .7)
  .to(wTit, { yPercent: -115, duration: .45, stagger: .03, ease: 'power3.in' }, G)
  .to('#gancho', { clipPath: 'inset(0% 0% 100% 0% round 40px)', y: -40, duration: .55, ease: 'power3.in' }, G + .2)
  .to('#placar', { y: 8, duration: 1.4, yoyo: true, repeat: Math.max(1, Math.floor((H - 4.5) / 1.4)), ease: 'sine.inOut' }, 1.4);
// 2. tensão: o placar pulsa cada vez mais rápido
// a tensão termina quando a carta aparece (C.revela); entre a revelação e o motion a carta fica sozinha na tela
const R = C.revela ?? H;
[[R - 3, .5], [R - 2, .36], [R - 1.1, .24], [R - .5, .16]].forEach(([t, d]) => tl.to('#placar .val', { scale: 1.07, duration: d, yoyo: true, repeat: 1, ease: 'sine.inOut' }, t));
// 3. hit
const cont = { v: -C.pack };
tl.to('#flash', { opacity: .75, duration: .07, ease: 'none' }, H).to('#flash', { opacity: 0, duration: .5, ease: 'power2.out' }, H + .07)
  .fromTo('.anel', { scale: .3, opacity: .9, transformOrigin: '540px 900px' }, { scale: 3.4, opacity: 0, duration: 1.2, stagger: .13, immediateRender: false }, H)
  .to(cont, { v: C.valor - C.pack, duration: 1.3, onUpdate: () => { $('placarTxt').textContent = brl(cont.v); } }, H)
  .fromTo('#placarTxt', { filter: 'blur(6px)' }, { filter: 'blur(0px)', duration: .9, immediateRender: false }, H)
  .to('#placar .val', { color: '#2ee36b', borderColor: '#2ee36b', duration: .3, ease: 'power2.out' }, H + .12)
  .to('#placar .val', { scale: 1.2, duration: .14, ease: 'power2.out' }, H)
  .to('#placar .val', { scale: 1, duration: 1, ease: 'elastic.out(1.1, .4)' }, H + .14)
  .fromTo('#sheenPlacar', { left: '-60%' }, { left: '140%', duration: .8, ease: 'power2.inOut', immediateRender: false }, H + .6)
  .fromTo('#hit', { scale: 3, rotation: 40, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: .28, ease: 'power4.in', immediateRender: false }, H + .1)
  .to('#hit', { scaleY: .84, scaleX: 1.1, duration: .08, ease: 'power2.out' }, H + .38)
  .to('#hit', { scaleY: 1, scaleX: 1, duration: .8, ease: 'elastic.out(1.2, .35)' }, H + .46)
  .to('#hit', { rotation: 8, duration: 1, yoyo: true, repeat: 3, ease: 'sine.inOut' }, H + 1.2)
  .fromTo('#faixa', { clipPath: 'inset(100% 0% 0% 0% round 36px)', y: 120, opacity: 1 }, { clipPath: 'inset(0% 0% 0% 0% round 36px)', y: 0, duration: .85, immediateRender: false }, H + .4)
  .from('#faixa .topo, #faixa .nome, #faixa .preco, #faixa .fonte', { y: 34, opacity: 0, duration: .6, stagger: .07 }, H + .6);
const pv = { v: 0 };
tl.to(pv, { v: C.valor, duration: 1.1, onUpdate: () => { $('preco').textContent = reais(pv.v); } }, H + .75)
  .fromTo('#sheenFaixa', { left: '-60%' }, { left: '140%', duration: .9, ease: 'power2.inOut', immediateRender: false }, H + 1.6);
brilhos.forEach((b, i) => {
  const a = (i / brilhos.length) * Math.PI * 2, r = 380 + (i % 3) * 90, s = .5 + (i % 4) * .25;
  gsap.set(b, { left: 505, top: 865, scale: s });
  tl.fromTo(b, { x: 0, y: 0, opacity: 0, rotation: 0 }, { opacity: 1, x: Math.cos(a) * r, y: Math.sin(a) * r * 1.3, rotation: 180, duration: 1.1, immediateRender: false }, H + .05 + (i % 5) * .03)
    .to(b, { opacity: 0, scale: 0, duration: .5, ease: 'power2.in' }, H + .8 + (i % 5) * .05);
});
// 4. transição em círculo para a lâmina na cor do tipo
tl.to('#hit, #faixa, #placar', { scale: .9, opacity: 0, duration: .35, stagger: .04, ease: 'power2.in' }, F - .45)
  .to('#fim', { clipPath: 'circle(1400px at 540px 900px)', duration: 1, ease: 'expo.inOut' }, F - .3)
  .from('#fim .marca', { rotation: -50, scale: .6, transformOrigin: '50% 50%', duration: 1.6 }, F - .1)
  .to('#fim .marca', { rotation: 12, duration: C.fimDur, ease: 'none' }, F + 1.5)
  .from('#fim .logo, #fim .tag', { y: 30, opacity: 0, duration: .7, stagger: .07 }, F + .25)
  .from(wH1, { yPercent: 115, rotation: 6, duration: .8, stagger: .08 }, F + .35);
const fl = { v: 0 };
tl.to(fl, { v: C.valor - C.pack, duration: 1.1, onUpdate: () => { $('fimLucro').textContent = brl(fl.v); } }, F + .55)
  .from('#fim .lucro', { y: 40, opacity: 0, duration: .6 }, F + .55)
  .from('#fim .lin', { x: -70, opacity: 0, duration: .7, stagger: .12 }, F + .8)
  .from(wH2, { yPercent: 115, rotation: 6, duration: .8, stagger: .07 }, F + 1.1)
  .from('#fim p, #fim .cta, #fim .perfil', { y: 30, opacity: 0, duration: .7, stagger: .08 }, F + 1.35)
  .fromTo('#sheenCta', { left: '-60%' }, { left: '140%', duration: .9, ease: 'power2.inOut', repeat: 2, repeatDelay: .5, immediateRender: false }, F + 1.9)
  .to('#fim .cta', { scale: 1.05, duration: .5, yoyo: true, repeat: 3, ease: 'sine.inOut' }, F + 1.9)
  .set({}, {}, D);
window.tl = tl;
</script>
</body>
</html>
