<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Hit GSAP</title>
<!-- Camada de vídeo 9:16 no design system TCG Price Hunter (seção Social): lupa caçadora, ficha de tipo,
     selo "Caçado pelo", sticker, ticket serrilhado, brilhos e lâmina final CTAGrupo. Zona segura 250–1620 px. -->
<style>
@font-face{font-family:Rubik;font-weight:500;src:url(rubik500.ttf)}
@font-face{font-family:Rubik;font-weight:700;src:url(rubik700.ttf)}
@font-face{font-family:Rubik;font-weight:800;src:url(rubik800.ttf)}
@font-face{font-family:Rubik;font-weight:900;src:url(rubik900.ttf)}
:root{
  --font-sans:Rubik,sans-serif;
  --ink:#131f49;--muted:#556079;--cover:#1b2c74;--cover-2:#24398f;--cover-muted:#c3cceb;
  --sticker:#ffcf33;--sticker-ink:#2b2200;--hot:#c93d25;--ok:#0b7148;
  --e-fire:#e0512b;--e-water:#2c7be5;--e-grass:#2f9a55;--e-psychic:#8e4bd6;--e-metal:#6e7a90;
  --t-lutador:#c25a1c;--t-escuridao:#2b2d42;--t-dragao:#a8801a;--t-fada:#e05aa0;--t-incolor:#c9ced8;--t-ink:#131f49;
  --sp-navy:#0e1330;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:var(--font-sans);font-variant-numeric:tabular-nums}
#palco{position:absolute;inset:0;overflow:hidden}
#palco > *{position:absolute}

/* Tipagem */
[data-tipo="planta"]{--ty:var(--e-grass);--tyi:#fff}[data-tipo="fogo"]{--ty:var(--e-fire);--tyi:#fff}[data-tipo="agua"]{--ty:var(--e-water);--tyi:#fff}
[data-tipo="eletrico"]{--ty:var(--sticker);--tyi:var(--t-ink)}[data-tipo="psiquico"]{--ty:var(--e-psychic);--tyi:#fff}[data-tipo="lutador"]{--ty:var(--t-lutador);--tyi:#fff}
[data-tipo="escuridao"]{--ty:var(--t-escuridao);--tyi:#fff}[data-tipo="metal"]{--ty:var(--e-metal);--tyi:#fff}[data-tipo="dragao"]{--ty:var(--t-dragao);--tyi:#fff}
[data-tipo="fada"]{--ty:var(--t-fada);--tyi:#fff}[data-tipo="incolor"]{--ty:var(--t-incolor);--tyi:var(--t-ink)}
.tipo{display:inline-grid;place-items:center;width:var(--ts,64px);height:var(--ts,64px);border-radius:32%;background:var(--ty);color:var(--tyi);box-shadow:0 0 0 calc(var(--ts,64px)*.07) #fff,0 calc(var(--ts,64px)*.1) 0 calc(var(--ts,64px)*.07) rgba(9,13,35,.35);flex:none}
.tipo svg{width:62%;height:62%;fill:currentColor}
.tipo-chip{display:inline-flex;align-items:center;gap:14px;padding:10px 26px 10px 10px;border-radius:999px;background:#fff;color:var(--ink);font:800 26px/1 var(--font-sans);letter-spacing:2px;text-transform:uppercase;box-shadow:0 8px 0 rgba(9,13,35,.25);white-space:nowrap}
.tipo-chip.sem{padding:18px 28px;background:var(--ink);color:#fff}
.tipo-chip .tipo{--ts:52px;box-shadow:none}

/* abertura */
#barra{left:0;right:0;top:0;height:18px;background:var(--lote)}
#pill{left:72px;top:262px;display:inline-flex;align-items:center;padding:14px 32px;border-radius:999px;background:var(--sticker);color:var(--sticker-ink);font:700 30px/1 var(--font-sans);letter-spacing:3px;text-transform:uppercase;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#titulo{left:72px;right:72px;top:1150px;font:900 104px/.95 var(--font-sans);letter-spacing:-4px;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.6),0 0 40px rgba(0,0,0,.45);text-wrap:balance}
#titulo em{font-style:normal;color:var(--sticker)}
#chipSet{left:72px;top:1480px}

/* lupa caçadora = placar */
.lupa{width:var(--ls);height:var(--ls);border-radius:50%;overflow:visible}
.lupa .lente{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:calc(var(--ls)*.07) solid #0b0b0f;box-shadow:0 0 0 calc(var(--ls)*.025) #fff,0 24px 50px rgba(0,0,0,.45);background:var(--hot);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
.lupa .lente::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(60% 50% at 30% 22%,rgba(255,255,255,.45),transparent 60%)}
.lupa .cabo{position:absolute;width:calc(var(--ls)*.16);height:calc(var(--ls)*.48);right:calc(var(--ls)*-.08);bottom:calc(var(--ls)*-.36);background:#0b0b0f;border-radius:calc(var(--ls)*.06);transform:rotate(-45deg);transform-origin:top center;box-shadow:0 0 0 calc(var(--ls)*.025) #fff}
#lupa{--ls:350px;right:110px;top:250px}
#lupa .v{position:relative;z-index:1;font:900 56px/1 var(--font-sans);letter-spacing:-2px;white-space:nowrap}
#lupa .k{position:relative;z-index:1;font:700 24px/1.1 var(--font-sans);margin-top:8px}
#lupa .verde{position:absolute;inset:0;border-radius:50%;background:var(--ok);opacity:0}

/* hit */
#flash{inset:0;background:#fff;opacity:0}
#sticker{left:72px;top:620px;width:210px;height:210px;border-radius:50%;background:var(--hot);color:#fff;display:flex;align-items:center;justify-content:center;font:900 64px/1 var(--font-sans);letter-spacing:-1px;box-shadow:0 0 0 8px #fff,0 12px 40px rgba(0,0,0,.5);transform:scale(0)}
#selo{width:240px;height:240px;right:72px;top:1010px;opacity:0}
#selo svg,.selo svg{width:100%;height:100%;overflow:visible}
#serra{left:72px;top:1262px;width:936px;height:24px;opacity:0}
#ticket{left:72px;right:72px;top:1285px;background:#fff;color:var(--ink);border-radius:0 0 24px 24px;padding:28px 40px 30px;box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0}
#ticket .lin1{display:flex;align-items:center;gap:18px}
#ticket .rar{font:800 24px/1 var(--font-sans);letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
#ticket .lin2{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-top:18px}
#ticket .nome{font:900 62px/1 var(--font-sans);letter-spacing:-2px;white-space:nowrap}
#ticket .valor{font:900 62px/1 var(--font-sans);letter-spacing:-2px;color:var(--ok);white-space:nowrap}
#ticket .fonte{font:500 22px/1.3 var(--font-sans);color:var(--muted);margin-top:14px}
.brilho{width:var(--b);height:var(--b);opacity:0;color:#fff}
.brilho svg{width:100%;height:100%;display:block}

/* lâmina final: CTAGrupo em 9:16 */
#fim{inset:0;background:var(--sticker);color:var(--ink);transform:translateY(100%);overflow:hidden}
#fim > *{position:absolute}
#fim .barra{left:0;right:0;top:0;height:18px;background:var(--lote)}
#fim .eb{left:72px;top:270px;display:flex;align-items:center;gap:14px;font:700 26px/1 var(--font-sans);letter-spacing:3px;text-transform:uppercase}
#fim .eb i{width:22px;height:22px;border-radius:5px;background:var(--lote)}
#fim .logo{right:72px;top:236px;width:220px}
#fim .tag{left:72px;top:400px;font:800 34px/1 var(--font-sans)}
#fim h1{left:72px;right:72px;top:452px;font:900 132px/.95 var(--font-sans);letter-spacing:-5px}
#fim .lucro{left:72px;top:582px;font:900 132px/1 var(--font-sans);letter-spacing:-5px;color:var(--ok)}
#fim .box{left:72px;right:72px;top:770px;background:#fff;border-radius:24px;padding:8px 36px;box-shadow:0 12px 40px rgba(19,31,73,.14)}
#fim .lin{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:22px 0;font:700 38px/1.1 var(--font-sans)}
#fim .lin + .lin{border-top:3px solid #e3e7ef}
#fim .lin small{display:block;font:500 24px/1.2 var(--font-sans);color:var(--muted);margin-top:6px}
#fim .lin b{font-weight:900;white-space:nowrap}
#fim .lin b.neg{color:#ae2318}#fim .lin b.pos{color:var(--ok)}
#fim h2{left:72px;top:1110px;font:900 112px/.95 var(--font-sans);letter-spacing:-4px}
#fim h2 em{font-style:normal;color:var(--e-water)}
#fim p{left:72px;right:72px;top:1350px;font:500 34px/1.3 var(--font-sans)}
#fim .acoes{left:72px;right:72px;top:1470px;display:flex;align-items:center;justify-content:space-between;gap:24px}
#fim .btn{display:inline-flex;align-items:center;padding:30px 44px;border-radius:999px;background:var(--ink);color:#fff;font:800 36px/1 var(--font-sans);white-space:nowrap}
#fim .site{font:700 30px/1.25 var(--font-sans);text-align:right}
#fim .selo{left:770px;top:1060px;width:240px;height:240px}
/* lâmina no tipo da carta (Tipagem: .sp.tipo-bg) */
#fim.tipo-bg{background:var(--ty);color:#fff}
#fim.tipo-bg .barra,#fim.tipo-bg .eb i{background:var(--sticker)}
#fim .box{color:var(--ink)}
#fim.tipo-bg .lucro{color:#fff;background:var(--ok);padding:6px 30px 14px;border-radius:28px;box-shadow:0 8px 0 rgba(9,13,35,.25);font-size:118px;top:590px}
#fim.tipo-bg h1,#fim.tipo-bg h2{text-shadow:0 6px 0 rgba(0,0,0,.28)}
#fim.tipo-bg h2 em{color:var(--sticker)}
#fim.tipo-bg .btn{background:var(--sticker);color:var(--sticker-ink)}
#fim.tipo-bg[data-tipo="eletrico"],#fim.tipo-bg[data-tipo="incolor"]{color:var(--t-ink)}
#fim.tipo-bg[data-tipo="eletrico"] h2 em,#fim.tipo-bg[data-tipo="incolor"] h2 em{color:var(--e-water)}
#fim.tipo-bg[data-tipo="eletrico"] .eb i,#fim.tipo-bg[data-tipo="eletrico"] .barra{background:var(--ink)}
#fim.tipo-bg[data-tipo="eletrico"] h1,#fim.tipo-bg[data-tipo="eletrico"] h2,#fim.tipo-bg[data-tipo="incolor"] h1,#fim.tipo-bg[data-tipo="incolor"] h2{text-shadow:none}
#fim.tipo-bg[data-tipo="eletrico"] .btn,#fim.tipo-bg[data-tipo="incolor"] .btn{background:var(--ink);color:#fff}

/* motion premium */
.mask{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .1em;margin:0 -.04em -.1em}
.mask > span{display:inline-block;will-change:transform}
.sheen{position:absolute;top:-30%;bottom:-30%;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-18deg);pointer-events:none;z-index:2}
#ticket{overflow:hidden}
#fim .btn{position:relative;overflow:hidden}
#aneis{left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.anel{opacity:0}
#lupa .verde{transform:scale(0);opacity:1}
#fim{transform:none;clip-path:circle(0px at 540px 960px)}
#fim .lucro{overflow:hidden}
</style>
</head>

<script>
const C = window.CFG || {};
const fmt = (v) => Math.abs(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const brl = (v) => (v < 0 ? '−' : '+') + 'R$ ' + fmt(v);
const reais = (v) => 'R$ ' + fmt(v);
const $ = (id) => document.getElementById(id);
const ficha = (t, ts) => `<span class="tipo" data-tipo="${t}" style="--ts:${ts}px"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-t-${t}"/></svg></span>`;
const NOMES = { planta: 'Planta', fogo: 'Fogo', agua: 'Água', eletrico: 'Elétrico', psiquico: 'Psíquico', lutador: 'Lutador', escuridao: 'Escuridão', metal: 'Metal', dragao: 'Dragão', fada: 'Fada', incolor: 'Incolor' };
const selo = (id) => `<svg viewBox="0 0 200 200" aria-hidden="true"><defs><path id="${id}" d="M100,100 m-74,0 a74,74 0 1,1 148,0 a74,74 0 1,1 -148,0"/></defs><circle cx="100" cy="100" r="97" fill="#ffcf33" stroke="#0b0b0f" stroke-width="6"/><circle cx="100" cy="100" r="58" fill="#fff" stroke="#0b0b0f" stroke-width="4"/><text font-family="Rubik, sans-serif" font-weight="900" font-size="17" letter-spacing="2.2" fill="#0b0b0f"><textPath href="#${id}" textLength="456" lengthAdjust="spacingAndGlyphs">CAÇADO PELO TCG PRICE HUNTER • MENOR PREÇO • </textPath></text><image href="logo-icone.png" x="64" y="64" width="72" height="72"/></svg>`;

// a cor do lote vem do tipo da coleção (Fogo Fantasmagórico = Fogo; Escuridão Absoluta = Escuridão)
document.documentElement.style.setProperty('--lote', `var(--${{ fogo: 'e-fire', escuridao: 't-escuridao', psiquico: 'e-psychic' }[C.tipoLote] || 'sticker'})`);
$('pill').textContent = C.colecao;
$('titulo').innerHTML = C.titulo;
$('chipSet').innerHTML = `<span class="tipo-chip">${ficha(C.tipoLote, 52)}${C.produto}</span>`;
$('placarVal').textContent = brl(-C.pack); $('placarK').textContent = C.porQue;
$('selo').innerHTML = selo('s1'); $('fimSelo').innerHTML = selo('s2');
$('tChip').innerHTML = (C.tipoCarta ? `<span class="tipo-chip">${ficha(C.tipoCarta, 52)}Tipo ${NOMES[C.tipoCarta]}</span>` : `<span class="tipo-chip sem">${C.categoria}</span>`) + `<span class="rar">${C.raridade}</span>`;
$('tNome').textContent = C.carta; $('tValor').textContent = reais(C.valor);
$('tFonte').textContent = 'Média de venda dos últimos 3 meses · Liga Pokémon · 31/10';
$('fimTag').textContent = C.colecao;
// lâmina final na cor do tipo da carta: estampa do ícone a 13% e ícone gigante a 16% saindo pela borda (Tipagem)
if (C.tipoCarta) {
  const f = $('fim'); f.classList.add('tipo-bg'); f.dataset.tipo = C.tipoCarta;
  const claro = ['eletrico', 'incolor'].includes(C.tipoCarta), cor = claro ? '#131f49' : '#fff';
  ['pu1', 'pu2', 'gigante'].forEach((id) => { $(id).setAttribute('href', '#i-t-' + C.tipoCarta); $(id).setAttribute('fill', cor); });
  $('estampa').setAttribute('opacity', '0.13'); $('gigante').setAttribute('opacity', '0.16'); $('raio').remove(); $('halo').setAttribute('opacity', '.1');
}
$('fimLucro').textContent = brl(C.valor - C.pack);
$('fimBox').innerHTML = `<div class="lin"><span>${C.linhaPack}<small>${C.notaPack}</small></span><b class="neg">${brl(-C.pack)}</b></div>`
  + `<div class="lin"><span>${C.carta}<small>média Liga Pokémon</small></span><b class="pos">${brl(C.valor)}</b></div>`;

// brilhos ✦ em volta da carta no hit
const B = [[170, 540, 72], [910, 700, 54], [860, 960, 44], [230, 1100, 60], [560, 610, 40], [960, 1150, 34]];
const brilhos = B.map(([x, y, s]) => { const d = document.createElement('div'); d.className = 'brilho'; d.style.cssText = `left:${x - s / 2}px;top:${y - s / 2}px;--b:${s}px`; d.innerHTML = '<svg viewBox="-30 -30 60 60"><use href="#brilho"/></svg>'; $('palco').insertBefore(d, $('fim')); return d; });

// palavras em máscara (sem plugin): cada palavra sobe de dentro da sua janela
const dividir = (el) => {
  const walk = (n) => [...n.childNodes].forEach((c) => {
    if (c.nodeType === 3) {
      const f = document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach((w) => { if (!w) return; if (/^\s+$/.test(w)) { f.append(' '); return; } const m = document.createElement('span'); m.className = 'mask'; const i = document.createElement('span'); i.textContent = w; m.append(i); f.append(m); });
      c.replaceWith(f);
    } else if (c.nodeType === 1 && c.tagName !== 'BR') walk(c);
  });
  walk(el); return el.querySelectorAll('.mask > span');
};
const wTit = dividir($('titulo')), wH1 = dividir($('fimH1')), wH2 = dividir($('fimH2'));

const H = C.hitT, D = C.dur, F = D - C.fimDur, G = C.ganchoAte;
const tl = gsap.timeline({ paused: true, defaults: { ease: 'expo.out' } });
const cont = { v: -C.pack };
const cabe = () => { const el = $('placarVal'); const n = el.textContent.length; el.style.fontSize = (n <= 8 ? 60 : n <= 9 ? 56 : n <= 10 ? 50 : 44) + 'px'; };
cabe();

// 1. abertura: faixa, pílula, lupa, gancho em máscara, ficha do produto
tl.from('#barra', { scaleX: 0, transformOrigin: 'left center', duration: .8 }, 0)
  .fromTo('#pill', { clipPath: 'inset(0% 100% 0% 0% round 999px)', letterSpacing: '14px' }, { clipPath: 'inset(0% 0% 0% 0% round 999px)', letterSpacing: '3px', duration: .9 }, .15)
  .from('#lupa', { y: -360, rotation: -70, scale: .4, duration: 1.3, ease: 'elastic.out(1, .55)' }, .25)
  .fromTo('#sheenLupa', { left: '-60%' }, { left: '130%', duration: .9, ease: 'power2.inOut' }, 1.1)
  .from(wTit, { yPercent: 115, rotation: 7, duration: .9, stagger: .07 }, .55)
  .from('#chipSet', { x: -160, opacity: 0, duration: .8 }, 1.05)
  .from('#chipSet .tipo', { rotation: -180, scale: .3, duration: 1, ease: 'back.out(2)' }, 1.1)
  .to(wTit, { yPercent: -115, duration: .45, stagger: .03, ease: 'power3.in' }, G)
  .to('#chipSet', { x: -160, opacity: 0, duration: .4, ease: 'power3.in' }, G + .1)
  .to('#lupa', { y: 10, duration: 1.4, yoyo: true, repeat: Math.max(1, Math.floor((H - 4.5) / 1.4)), ease: 'sine.inOut' }, 1.6)
  .to('#sheenLupa', { left: '130%', startAt: { left: '-60%' }, duration: .8, ease: 'power2.inOut' }, Math.max(G + .5, H - 6));
// 2. tensão antes do hit: a lupa pulsa cada vez mais rápido
[[H - 3, .5], [H - 2, .36], [H - 1.1, .24], [H - .5, .16]].forEach(([t, d]) => tl.to('#lupa', { scale: 1.07, duration: d, yoyo: true, repeat: 1, ease: 'sine.inOut' }, t));

// 3. hit
tl.to('#flash', { opacity: .75, duration: .07, ease: 'none' }, H).to('#flash', { opacity: 0, duration: .5, ease: 'power2.out' }, H + .07)
  .fromTo('.anel', { scale: .3, opacity: .9, transformOrigin: '540px 900px' }, { scale: 3.4, opacity: 0, duration: 1.2, stagger: .13, immediateRender: false }, H)
  .to('#lupa .verde', { scale: 1, duration: .5 }, H + .05)
  .to(cont, { v: C.valor - C.pack, duration: 1.3, onUpdate: () => { $('placarVal').textContent = brl(cont.v); cabe(); } }, H)
  .fromTo('#placarVal', { filter: 'blur(6px)' }, { filter: 'blur(0px)', duration: .9, immediateRender: false }, H)
  .call(() => { $('placarK').textContent = C.porQue; }, null, H + .14)
  .call(() => { $('placarK').textContent = 'de lucro'; }, null, H + .15)
  .to('#lupa', { scale: 1.25, rotation: 8, duration: .14, ease: 'power2.out' }, H)
  .to('#lupa', { scale: 1, rotation: 0, duration: 1, ease: 'elastic.out(1.1, .4)' }, H + .14)
  .fromTo('#sheenLupa', { left: '-60%' }, { left: '130%', duration: .7, ease: 'power2.inOut', immediateRender: false }, H + .5)
  .fromTo('#sticker', { scale: 3, rotation: 30, opacity: 0 }, { scale: 1, rotation: -8, opacity: 1, duration: .28, ease: 'power4.in', immediateRender: false }, H + .12)
  .to('#sticker', { scaleY: .82, scaleX: 1.12, duration: .08, ease: 'power2.out' }, H + .4)
  .to('#sticker', { scaleY: 1, scaleX: 1, duration: .8, ease: 'elastic.out(1.2, .35)' }, H + .48)
  .to('#sticker', { rotation: 3, duration: 1.1, yoyo: true, repeat: 2, ease: 'sine.inOut' }, H + 1.3)
  .fromTo('#serra', { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: .8, immediateRender: false }, H + .45)
  .fromTo('#ticket', { clipPath: 'inset(100% 0% 0% 0% round 0 0 24px 24px)', y: 140, opacity: 1 }, { clipPath: 'inset(0% 0% 0% 0% round 0 0 24px 24px)', y: 0, duration: .8, immediateRender: false }, H + .45)
  .from('#ticket .lin1 > *, #ticket .nome, #ticket .valor, #ticket .fonte', { y: 34, opacity: 0, duration: .6, stagger: .07 }, H + .7);
const tv = { v: 0 };
tl.to(tv, { v: C.valor, duration: 1.1, onUpdate: () => { $('tValor').textContent = reais(tv.v); } }, H + .8)
  .fromTo('#sheenTicket', { left: '-60%' }, { left: '140%', duration: .9, ease: 'power2.inOut', immediateRender: false }, H + 1.6)
  .fromTo('#selo', { scale: 2.6, rotation: 40, opacity: 0 }, { scale: 1, rotation: -10, opacity: 1, duration: .3, ease: 'power4.in', immediateRender: false }, H + 1.05)
  .to('#ticket, #serra', { x: 7, duration: .05, yoyo: true, repeat: 5, ease: 'none' }, H + 1.35)
  .to('#selo svg', { rotation: 360, transformOrigin: '50% 50%', duration: 18, ease: 'none' }, H + 1.35);
brilhos.forEach((b, i) => {
  const t0 = H + .15 + i * .09;
  tl.fromTo(b, { scale: 0, rotation: -90, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: .45, ease: 'back.out(3)', immediateRender: false }, t0)
    .to(b, { scale: 0, rotation: 90, opacity: 0, duration: .45, ease: 'power2.in' }, t0 + .6)
    .fromTo(b, { scale: 0, opacity: 0 }, { scale: .7, opacity: 1, duration: .35, ease: 'back.out(3)', immediateRender: false }, t0 + 1.5)
    .to(b, { scale: 0, opacity: 0, duration: .4, ease: 'power2.in' }, t0 + 2.0);
});

// 4. transição: tudo sai e a lâmina do tipo abre em círculo a partir da carta
tl.to('#sticker, #selo, #ticket, #serra, #lupa, #pill, #barra', { scale: .9, opacity: 0, duration: .35, stagger: .03, ease: 'power2.in' }, F - .45)
  .to('#fim', { clipPath: 'circle(1400px at 540px 900px)', duration: 1, ease: 'expo.inOut' }, F - .3)
  .from('#gigante', { rotation: -60, scale: .5, transformOrigin: '920px 580px', duration: 1.6 }, F - .1)
  .fromTo('#pfim', { attr: { patternTransform: 'rotate(-12) translate(0 0)' } }, { attr: { patternTransform: 'rotate(-12) translate(0 -150)' }, duration: C.fimDur + .3, ease: 'none', immediateRender: false }, F - .3)
  .from('#fim .eb, #fim .logo, #fim .tag', { y: 30, opacity: 0, duration: .7, stagger: .06 }, F + .25)
  .from(wH1, { yPercent: 115, rotation: 6, duration: .8, stagger: .08 }, F + .35)
  .fromTo('#fim .lucro', { clipPath: 'inset(0% 100% 0% 0% round 28px)' }, { clipPath: 'inset(0% 0% 0% 0% round 28px)', duration: .8, immediateRender: false }, F + .55);
const fl = { v: 0 };
tl.to(fl, { v: C.valor - C.pack, duration: 1.1, onUpdate: () => { $('fimLucro').textContent = brl(fl.v); } }, F + .55)
  .from('#fim .lin', { x: -70, opacity: 0, duration: .7, stagger: .12 }, F + .8)
  .from(wH2, { yPercent: 115, rotation: 6, duration: .8, stagger: .07 }, F + 1.1)
  .from('#fim p, #fim .acoes', { y: 30, opacity: 0, duration: .7, stagger: .08 }, F + 1.35)
  .fromTo('#fim .selo', { scale: 2.6, rotation: 40, opacity: 0 }, { scale: 1, rotation: -10, opacity: 1, duration: .3, ease: 'power4.in', immediateRender: false }, F + 1.55)
  .to('#fim .selo svg', { rotation: 360, transformOrigin: '50% 50%', duration: 18, ease: 'none' }, F + 1.85)
  .fromTo('#sheenBtn', { left: '-60%' }, { left: '140%', duration: .9, ease: 'power2.inOut', repeat: 2, repeatDelay: .5, immediateRender: false }, F + 1.9)
  .to('#fim .btn', { scale: 1.05, duration: .5, yoyo: true, repeat: 3, ease: 'sine.inOut' }, F + 1.9)
  .set({}, {}, D);
window.tl = tl;
</script>
</body>
</html>
