:root{
  --ground:#EDF1F8; --surface:#FFFFFF; --sunk:#E2E7F1; --ink:#131F49; --muted:#556079; --line:#D3DAE7;
  --cover:#1B2C74; --cover-2:#24398F; --cover-ink:#FFFFFF; --cover-muted:#C3CCEB;
  --sticker:#FFCF33; --sticker-ink:#2B2200;
  --ok:#0B7148; --ok-bg:#DAF2E5; --warn:#8F5200; --warn-bg:#FCEFD3; --bad:#AE2318; --bad-bg:#FBE1DE;
  --e-lightning:#E2A500; --e-fire:#E0512B; --e-water:#2C7BE5; --e-grass:#2F9A55; --e-psychic:#8E4BD6; --e-metal:#6E7A90;
  --shadow:0 1px 2px rgb(19 31 73 / .06), 0 6px 18px rgb(19 31 73 / .08);
  --shadow-lift:0 2px 4px rgb(19 31 73 / .08), 0 14px 34px rgb(19 31 73 / .16);
  --r-card:14px; --r-input:10px; --r-pill:999px;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --gutter:16px; --btn:#1B2C74; --btn-ink:#FFFFFF; --btn-hover:#24398F;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B1029; --surface:#151D42; --sunk:#0F1636; --ink:#EEF1FA; --muted:#A4AECC; --line:#27315D;
  --cover:#0F1840; --cover-2:#1A2558; --cover-ink:#FFFFFF; --cover-muted:#9FAAD3;
  --ok:#4CD49A; --ok-bg:#103A2C; --warn:#F2B451; --warn-bg:#3A2A0E; --bad:#FF8478; --bad-bg:#43191A;
  --e-lightning:#F5C431; --e-fire:#FF7A52; --e-water:#5EA2FF; --e-grass:#52C47B; --e-psychic:#B47CFF; --e-metal:#9AA6BC;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 22px rgb(0 0 0 / .28); --shadow-lift:0 2px 6px rgb(0 0 0 / .35), 0 18px 40px rgb(0 0 0 / .45); --btn:#FFCF33; --btn-ink:#231C00; --btn-hover:#FFDA5C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0B1029; --surface:#151D42; --sunk:#0F1636; --ink:#EEF1FA; --muted:#A4AECC; --line:#27315D;
  --cover:#0F1840; --cover-2:#1A2558; --cover-ink:#FFFFFF; --cover-muted:#9FAAD3;
  --ok:#4CD49A; --ok-bg:#103A2C; --warn:#F2B451; --warn-bg:#3A2A0E; --bad:#FF8478; --bad-bg:#43191A;
  --e-lightning:#F5C431; --e-fire:#FF7A52; --e-water:#5EA2FF; --e-grass:#52C47B; --e-psychic:#B47CFF; --e-metal:#9AA6BC;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 22px rgb(0 0 0 / .28); --shadow-lift:0 2px 6px rgb(0 0 0 / .35), 0 18px 40px rgb(0 0 0 / .45); --btn:#FFCF33; --btn-ink:#231C00; --btn-hover:#FFDA5C;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px}
body{margin:0;overflow-x:clip;background:var(--ground);color:var(--ink);font:400 16px/1.45 "Rubik",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100dvh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
::selection{background:var(--sticker);color:var(--sticker-ink)}
:focus-visible{outline:3px solid var(--e-water);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid var(--ground)}
.icon{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;fill:currentColor}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Capa do fichário */
.cover{background:var(--cover);color:var(--cover-ink);padding:calc(10px + env(safe-area-inset-top)) var(--gutter) 10px;position:relative;overflow:hidden}
.cover .pattern{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;color:#fff;opacity:.07}
.cover-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.brand span{display:block;font-size:12.5px;color:var(--cover-muted);line-height:1.2;white-space:nowrap}
@media (max-width:520px){.brand span span{display:none}.brand svg{width:30px;height:30px}.cover nav{gap:0}.navbtn{padding:9px 8px}}
.cover nav{margin-left:auto;display:flex;gap:4px}
.navbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--cover-ink);padding:9px 10px;border-radius:var(--r-pill);font-size:14px;font-weight:500;transition:background-color 160ms ease,transform 160ms var(--ease-out);position:relative}
.navbtn[aria-current="page"]{background:var(--cover-2)}
.navbtn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.navbtn:hover{background:var(--cover-2)}}
.navbtn .lbl{display:none}
.navbtn .count{position:absolute;top:3px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--sticker);color:var(--sticker-ink);font-size:11px;font-weight:700;line-height:17px;text-align:center}
@media (min-width:860px){.navbtn .lbl{display:inline}.navbtn .count{position:static;margin-left:2px}}

.wrap{max-width:1240px;margin:0 auto;padding:16px var(--gutter) calc(48px + env(safe-area-inset-bottom))}

/* Seletor principal */
.seg{max-width:520px;display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:var(--r-pill);padding:4px;position:relative;isolation:isolate}
.seg button{border:0;background:transparent;padding:10px 12px;border-radius:var(--r-pill);font-weight:600;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;transition:color 200ms ease,transform 160ms var(--ease-out);position:relative;z-index:1}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button:active{transform:scale(.97)}
.seg .thumb{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--surface);border-radius:var(--r-pill);box-shadow:var(--shadow);transition:transform 260ms var(--ease-out)}
.seg[data-v="abrir"] .thumb{transform:translateX(100%)}
.seg-hint{margin:8px 2px 0;font-size:13.5px;color:var(--muted)}

/* Layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:16px}
.layout > *{min-width:0}
@media (min-width:1000px){.layout{grid-template-columns:380px minmax(0,1fr);gap:28px;align-items:start}.side{position:sticky;top:16px}}

/* Toploader holográfico (o destaque) */
.toploader{--mx:.5;--my:.3;--rx:0deg;--ry:0deg;position:relative;padding:5px;border-radius:20px;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform 220ms var(--ease-out);
  background:conic-gradient(from calc(var(--mx) * 360deg) at 50% 50%,#ff5f6d,#ffc371,#fff36b,#7cf29a,#53c7ff,#8a7bff,#ff6ad5,#ff5f6d);box-shadow:var(--shadow-lift)}
.toploader::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,rgb(255 255 255 / .75) 46%,transparent 62%);background-size:260% 100%;background-position:calc(var(--mx) * 100%) 0;mix-blend-mode:soft-light;pointer-events:none}
.tl-card{position:relative;background:var(--surface);border-radius:15px;padding:16px;overflow:hidden}
.tl-card::after{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at calc(var(--mx) * 100%) calc(var(--my) * 100%),rgb(255 255 255 / .55),transparent 45%);mix-blend-mode:overlay;pointer-events:none;opacity:.7}
.tl-top{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);font-weight:500;margin-bottom:12px}
.tl-top .score{margin-left:auto;font-weight:700;color:var(--ink)}
.tl-body{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:start}
.photo{aspect-ratio:1;border-radius:12px;background:#fff;overflow:hidden;display:grid;place-items:center;position:relative}
.photo img{width:100%;height:100%;object-fit:contain;padding:6px}
.photo.fallback{background:color-mix(in srgb,var(--ec) 16%,var(--surface));color:var(--ec)}
.photo.fallback .icon{width:42%;height:42%}
.pocket .photo.fallback .icon{width:34%;height:34%}
.tl-name{margin:0;font-size:21px;font-weight:800;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.tl-type{margin:3px 0 0;font-size:15px;color:var(--muted)}
.tl-price{display:flex;align-items:flex-end;flex-wrap:wrap;gap:4px 12px;margin-top:14px}
.big{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.02em}
.ref{font-size:14px;color:var(--muted)}
.ref s{text-decoration-thickness:1.5px}
.sticker{display:inline-flex;align-items:center;gap:5px;background:var(--sticker);color:var(--sticker-ink);font-weight:800;font-size:14px;padding:5px 10px 5px 8px;border-radius:6px 6px 6px 14px;transform:rotate(-2.5deg);box-shadow:0 1px 0 rgb(0 0 0 / .18);white-space:nowrap}
.sticker.muted{background:var(--sunk);color:var(--muted);transform:none;box-shadow:none;font-weight:600}
.tl-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tl-actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;padding:5px 10px;border-radius:var(--r-pill);background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.seal{background:var(--ink);color:var(--surface)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-pill);padding:12px 18px;font-weight:700;font-size:15px;text-decoration:none;background:var(--btn);color:var(--btn-ink);transition:transform 160ms var(--ease-out),background-color 160ms ease;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--btn-hover)}.btn.ghost:hover{background:var(--line)}}

.summary{margin:14px 2px 0;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.summary b{color:var(--ink);font-weight:600}

/* Filtros */
.filters{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--gutter) * -1);padding:2px var(--gutter)}
.chips::-webkit-scrollbar{display:none}
.fchip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:8px 14px 8px 11px;font-size:14.5px;font-weight:500;white-space:nowrap;transition:transform 160ms var(--ease-out),border-color 160ms ease,background-color 160ms ease}
.fchip .icon{color:var(--ec,var(--muted))}
.fchip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.fchip[aria-pressed="true"] .icon{color:var(--ec-on,currentColor)}
.fchip:active{transform:scale(.97)}
.fchip small{font-size:12.5px;opacity:.7}
.selects{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:640px){.selects{grid-template-columns:repeat(2,minmax(0,280px))}}
.xf summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--muted);min-height:40px;padding:0 2px}
.xf summary::-webkit-details-marker{display:none}
.xf[open] summary{color:var(--ink)}
.xf .selects{margin-top:4px;align-items:end}
.xf .chip{font-size:12px;padding:2px 8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500;padding-left:2px}
.field select,.field input{appearance:none;width:100%;min-height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-input);padding:9px 34px 9px 12px;font-size:15px;min-width:0;text-overflow:ellipsis}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.field input{padding-right:12px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-height:44px;padding:0 2px}
.toggle input{width:20px;height:20px;accent-color:var(--cover)}

/* Página do fichário: bolsos */
.page-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 2px 10px}
.page-title h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.page-title span{font-size:13.5px;color:var(--muted)}
.binder{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:var(--sunk);border-radius:18px;padding:10px}
@media (min-width:700px){.binder{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px}}
@media (min-width:1280px){.binder{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pocket{position:relative;display:flex;flex-direction:column;text-align:left;border:0;padding:0;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;transition:transform 200ms var(--ease-out),box-shadow 200ms ease;min-width:0}
.pocket::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgb(255 255 255 / .55) 0%,rgb(255 255 255 / 0) 28%),linear-gradient(0deg,transparent calc(100% - 4px),rgb(19 31 73 / .07) calc(100% - 4px));pointer-events:none;mix-blend-mode:soft-light}
.pocket:active{transform:scale(.98)}
@media (hover:hover) and (pointer:fine){.pocket:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}}
.pocket .photo{border-radius:0;aspect-ratio:4/3}
.pk-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.pk-col{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:5px;min-width:0}
.pk-col span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-col .icon{color:var(--ec)}
.pk-name{font-size:15px;font-weight:700;line-height:1.2;margin:1px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pk-price{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.pk-sub{font-size:13px;color:var(--muted);margin-top:2px}
.pk-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;flex-wrap:wrap}
.pk-row .sticker{font-size:13px;padding:3px 8px 3px 7px}
.pk-store{font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

details.more{margin-top:20px}
details.more summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;padding:12px 2px;font-size:15.5px}
details.more summary::-webkit-details-marker{display:none}
details.more summary .icon{transition:transform 200ms var(--ease-out)}
details.more[open] summary .icon{transform:rotate(180deg)}
details.more p{margin:0 2px 12px;color:var(--muted);font-size:14px;max-width:65ch}

/* Vazio, carregando, erro */
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:28px 20px;text-align:center}
.empty h3{margin:0 0 6px;font-size:18px}
.empty p{margin:0 auto 16px;color:var(--muted);max-width:44ch;font-size:15px}
.skel{background:linear-gradient(90deg,var(--sunk) 25%,var(--line) 37%,var(--sunk) 63%);background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:var(--r-card)}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

/* Tabelas (lojas, comparador) */
.panel{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.panel h2{font-size:19px;margin:0;padding:16px 16px 4px}
.panel > p{margin:0;padding:0 16px 12px;color:var(--muted);font-size:14px;max-width:65ch}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 12px;white-space:nowrap;background:var(--sunk)}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
@media (hover:hover) and (pointer:fine){tr.click:hover td{background:var(--ground)}}
.store-list{display:grid;gap:10px}
.store{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.store b{font-size:16px}
.store .why{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.addstore{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;padding:4px 16px 16px}
.addstore .msg{grid-column:1/-1;font-size:13.5px;color:var(--muted);margin:0}
.rule{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);font-size:15px}
.alert{padding:14px 16px;border-top:1px solid var(--line)}
.alert pre{margin:0;font:inherit;font-size:14.5px;white-space:pre-wrap}
.alert small{display:block;color:var(--muted);margin-top:6px}
.stack{display:grid;gap:18px}

/* Ficha do produto (gaveta) */
dialog.sheet{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:100%;max-height:92dvh;margin:auto 0 0;border-radius:22px 22px 0 0;box-shadow:var(--shadow-lift);
  transform:translateY(0);transition:transform 320ms var(--ease-drawer),display 320ms allow-discrete,overlay 320ms allow-discrete}
dialog.sheet[open]{display:flex;flex-direction:column}
@starting-style{dialog.sheet[open]{transform:translateY(100%)}}
dialog.sheet:not([open]){transform:translateY(100%)}
dialog.sheet::backdrop{background:rgb(9 13 35 / .55);transition:opacity 320ms ease,display 320ms allow-discrete,overlay 320ms allow-discrete;opacity:1}
@starting-style{dialog.sheet[open]::backdrop{opacity:0}}
@media (min-width:760px){dialog.sheet{margin:auto;max-width:720px;border-radius:22px;max-height:88dvh;transition:transform 220ms var(--ease-out),opacity 220ms ease,display 220ms allow-discrete,overlay 220ms allow-discrete}
  @starting-style{dialog.sheet[open]{transform:scale(.96);opacity:0}}dialog.sheet:not([open]){transform:scale(.96);opacity:0}}
.sh-grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0;flex:none}
@media (min-width:760px){.sh-grip{display:none}}
.sh-head{display:grid;grid-template-columns:96px 1fr auto;gap:14px;padding:14px 16px 12px;align-items:start}
.sh-head h2{margin:0;font-size:20px;line-height:1.15;font-weight:800}
.sh-head p{margin:3px 0 0;color:var(--muted);font-size:14.5px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--sunk);display:grid;place-items:center;transition:transform 160ms var(--ease-out)}
.iconbtn:active{transform:scale(.95)}
.sh-scroll{overflow-y:auto;padding:0 16px calc(20px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.fact{background:var(--sunk);border-radius:12px;padding:10px 12px;min-width:0}
.fact span{display:block;font-size:12.5px;color:var(--muted)}
.fact b{display:block;font-size:17px;font-weight:700;margin-top:2px}
.fact small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3}
.offer{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.offer:first-of-type{border-top:0}
.offer .st{font-weight:700;font-size:15.5px}
.offer .pr{font-weight:800;font-size:19px;text-align:right}
.offer .dt{font-size:13.5px;color:var(--muted)}
.offer .dt.r{text-align:right}
.offer .act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.note{font-size:13px;color:var(--muted);margin:12px 0 0;max-width:65ch}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0ms!important;animation:none!important}
  .toploader{transform:none!important}
}
@media (prefers-reduced-motion:no-preference){
  .toploader.shine::before{animation:sweep 1100ms var(--ease-out) 250ms 1 both}
  @keyframes sweep{from{background-position:120% 0}to{background-position:-20% 0}}
}
</style>
</head>

const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(v)=>v==null?"-":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pct=(v)=>v==null?"-":(v*100).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
const ago=(iso)=>{if(!iso)return"-";const m=Math.round((Date.now()-Date.parse(iso))/6e4);return m<1?"agora":m<60?`há ${m} min`:m<1440?`há ${Math.round(m/60)} h`:`há ${Math.round(m/1440)} d`};
const ic=(id,cls="icon")=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const store={get(k,d){try{const v=localStorage.getItem("ph:"+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem("ph:"+k,JSON.stringify(v))}catch{}}};

/* Cores de energia por grupo de produto */
const GROUP={Boosters:{icon:"lightning-f",c:"var(--e-lightning)"},ETB:{icon:"flame-f",c:"var(--e-fire)"},Blisters:{icon:"drop-f",c:"var(--e-water)"},Latas:{icon:"cylinder-f",c:"var(--e-metal)"},"Coleções":{icon:"sparkle-f",c:"var(--e-psychic)"},Baralhos:{icon:"leaf-f",c:"var(--e-grass)"}};
const GROUP_ORDER=["Boosters","ETB","Blisters","Coleções","Latas","Baralhos"];
const g=(p)=>GROUP[p?.group]||GROUP["Coleções"];
const TIER={exceptional:"Excepcional",excellent:"Excelente",verygood:"Muito bom",good:"Bom",normal:"Normal",ignore:"Fraco"};
const STOCK={IN_STOCK:["ok","Em estoque"],OUT_OF_STOCK:["","Sem estoque"],PRE_ORDER:["warn","Pré-venda"],UNKNOWN:["warn","Estoque não confirmado"],UNAVAILABLE:["","Indisponível"]};
const SRC={ACTIVE:["ok","Ativa"],BLOCKED:["bad","Bloqueia robôs"],ERROR:["bad","Com erro"],PENDING:["warn","Sem endereço"],UNAVAILABLE:["","Sem integração"],PAUSED:["","Pausada"]};

let S=null,P={},OFF=[];
const F=Object.assign({mode:"guardar",group:"",col:"",store:"",sort:"",stock:true},store.get("f",{}));
let view="deals";

function stockChip(o){const[c,l]=STOCK[o.stock]||["",o.stock];return`<span class="chip ${c}">${o.stock==="IN_STOCK"&&o.quantity?`${o.quantity} em estoque`:l}</span>`}
function photo(p,o,cls="photo"){
  const src=o?.image||p?.image;const gg=g(p);
  const fb=`<div class="${cls} fallback" style="--ec:${gg.c}" aria-hidden="true">${ic(gg.icon)}</div>`;
  if(!src)return fb;
  return`<div class="${cls}"><img src="${esc(src)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.closest('.photo').outerHTML=this.closest('.photo').dataset.fb" ></div>`.replace('<div class="'+cls+'">',`<div class="${cls}" data-fb="${esc(fb)}">`);
}
const live=(o)=>o.stock==="IN_STOCK"&&!o.stale&&!o.anomalous&&o.total>0;
const label=(p)=>p.typeLabel+(p.boosters&&(p.type==="booster_box"||p.type==="combo")?` ${p.boosters}`:"")+(p.variant?` ${p.variant}`:"");

/* Agrupa ofertas por produto e escolhe a melhor de cada um conforme o objetivo */
function entries(){
  const by={};
  for(const o of OFF){
    if(F.stock&&!live(o))continue;
    if(!F.stock&&(o.stale||o.anomalous||o.stock==="OUT_OF_STOCK"))continue;
    const p=P[o.productId];if(!p)continue;
    if(F.group&&p.group!==F.group)continue;
    if(F.col&&p.collection!==F.col)continue;
    if(F.store&&o.storeId!==F.store)continue;
    if(F.mode==="abrir"&&!o.perBooster)continue;
    (by[p.id]||=[]).push(o);
  }
  const key=F.mode==="abrir"?(o)=>o.perBooster:(o)=>o.total;
  return Object.entries(by).map(([id,list])=>{list.sort((a,b)=>key(a)-key(b)||(b.dealScore??-1)-(a.dealScore??-1));return{p:P[id],o:list[0],n:list.length}});
}
function sortEntries(list){
  const s=F.sort||(F.mode==="abrir"?"ppb":"score");
  const cmp={score:(a,b)=>(b.o.dealScore??-1)-(a.o.dealScore??-1)||(b.o.discount??-9)-(a.o.discount??-9),disc:(a,b)=>(b.o.discount??-9)-(a.o.discount??-9),price:(a,b)=>a.o.total-b.o.total,ppb:(a,b)=>(a.o.perBooster??1e9)-(b.o.perBooster??1e9)}[s]||(()=>0);
  return list.sort(cmp);
}

function toploader(e){
  const{p,o,n}=e;const gg=g(p);const abrir=F.mode==="abrir";
  const disc=o.discount!=null&&o.discount>0;
  return`<section class="toploader shine" id="tl" aria-label="Melhor oferta agora">
  <div class="tl-card">
    <div class="tl-top">${ic("seal-check-f")}<span>${abrir?"Menor preço por booster":"Melhor oferta agora"}</span>${o.dealScore!=null?`<span class="score">Deal Score ${o.dealScore}</span>`:""}</div>
    <div class="tl-body">
      ${photo(p,o)}
      <div>
        <h1 class="tl-name">${esc(p.collectionName)}</h1>
        <p class="tl-type">${esc(label(p))}</p>
      </div>
    </div>
    <div class="tl-price">
      <span class="big">${money(abrir?o.perBooster:o.total)}</span>
      ${abrir?`<span class="ref">por booster, total ${money(o.total)}</span>`:(p.copagConfirmed?`<span class="ref">Copag <s>${money(p.msrp)}</s></span>`:`<span class="ref">Copag não confirmado</span>`)}
    </div>
    <div class="tl-meta">
      ${disc?`<span class="sticker">${ic("tag-f")}-${pct(o.discount)} vs Copag</span>`:""}
      ${stockChip(o)}
      ${o.opportunity?`<span class="chip seal">${ic("seal-check-f")}Oportunidade</span>`:""}
      <span class="chip">${ic("storefront")}${esc(o.storeName)}</span>
    </div>
    <div class="tl-actions">
      <a class="btn" href="${esc(o.url)}" target="_blank" rel="noopener">Ver na loja ${ic("arrow-square-out")}</a>
      <button class="btn ghost" type="button" data-p="${esc(p.id)}">${n>1?`Comparar ${n} lojas`:"Detalhes"}</button>
    </div>
  </div>
</section>`;
}

function pocket(e){
  const{p,o,n}=e;const gg=g(p);const abrir=F.mode==="abrir";
  const disc=o.discount!=null&&o.discount>0;
  return`<button class="pocket" type="button" data-p="${esc(p.id)}" style="--ec:${gg.c}">
  ${photo(p,o)}
  <span class="pk-body">
    <span class="pk-col">${ic(gg.icon)}<span>${esc(p.collectionName)}</span></span>
    <span class="pk-name">${esc(label(p))}</span>
    <span class="pk-price">${money(abrir?o.perBooster:o.total)}</span>
    <span class="pk-sub">${abrir?`por booster, total ${money(o.total)}`:(p.copagConfirmed?`Copag ${money(p.msrp)}`:"Copag não confirmado")}</span>
    <span class="pk-row">${disc?`<span class="sticker">-${pct(o.discount)}</span>`:(p.copagConfirmed?`<span class="sticker muted">Acima da Copag</span>`:"")}${o.stock!=="IN_STOCK"?stockChip(o):""}</span>
    <span class="pk-store">${esc(o.storeName)}${n>1?` e mais ${n-1}`:""}</span>
  </span>
</button>`;
}

function filtersHTML(all){
  const groups=GROUP_ORDER.filter((gr)=>all.some((e)=>e.p.group===gr));
  const cols=(S.collections||[]).filter((c)=>all.some((e)=>e.p.collection===c.id));
  const series=[...new Set(cols.map((c)=>c.series||"Outras"))];
  const stores=[...new Map(all.map((e)=>[e.o.storeId,e.o.storeName])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));
  const sorts=F.mode==="abrir"?[["ppb","Preço por booster"],["price","Menor preço"],["score","Deal Score"]]:[["score","Oportunidade"],["disc","Maior desconto"],["price","Menor preço"]];
  const chip=(v,l,icon,c,count)=>`<button class="fchip" type="button" data-g="${v}" aria-pressed="${F.group===v}" ${c?`style="--ec:${c}"`:""}>${icon?ic(icon):""}${l}${count!=null?` <small>${count}</small>`:""}</button>`;
  return`<div class="filters">
  <div class="chips" role="group" aria-label="Tipo de produto">${chip("","Todos",null,null,null)}${groups.map((gr)=>chip(gr,gr,GROUP[gr].icon,GROUP[gr].c,all.filter((e)=>e.p.group===gr).length)).join("")}</div>
  <div class="selects">
    <div class="field"><label for="f-col">Coleção</label><select id="f-col" data-f="col"><option value="">Todas as coleções</option>${series.map((sr)=>`<optgroup label="${esc(sr)}">${cols.filter((c)=>(c.series||"Outras")===sr).map((c)=>`<option value="${esc(c.id)}"${F.col===c.id?" selected":""}>${esc(c.name)}</option>`).join("")}</optgroup>`).join("")}</select></div>
    <div class="field"><label for="f-sort">Ordenar por</label><select id="f-sort" data-f="sort">${sorts.map(([v,l])=>`<option value="${v}"${(F.sort||sorts[0][0])===v?" selected":""}>${l}</option>`).join("")}</select></div>
  </div>
  <details class="xf"${F.store||!F.stock?" open":""}><summary>${ic("funnel")}Mais filtros${F.store||!F.stock?` <span class="chip warn">ativos</span>`:""}</summary>
    <div class="selects">
      <div class="field"><label for="f-store">Loja</label><select id="f-store" data-f="store"><option value="">Todas as lojas</option>${stores.map(([id,n])=>`<option value="${esc(id)}"${F.store===id?" selected":""}>${esc(n)}</option>`).join("")}</select></div>
      <label class="toggle"><input type="checkbox" data-f="stock"${F.stock?" checked":""}> Só com estoque confirmado</label>
    </div>
  </details>
</div>`;
}

function renderDeals(){
  const raw=entries();
  const base=F.mode==="guardar"?raw.filter((e)=>e.p.copagConfirmed):raw;
  const noCopag=F.mode==="guardar"?raw.filter((e)=>!e.p.copagConfirmed):[];
  const list=sortEntries(base.slice());
  const all=(()=>{const keep={...F};F.group="";F.col="";F.store="";const r=entries();Object.assign(F,keep);return r})();
  const top=list[0];
  const stores=new Set(OFF.filter(live).map((o)=>o.storeId)).size;
  const filtered=!!(F.group||F.col||F.store);
  const side=top?toploader(top):filtered
    ?`<div class="empty"><h3>Nenhuma oferta com esses filtros</h3><p>${noCopag.length?`Há ${noCopag.length} ${noCopag.length>1?"produtos":"produto"} sem preço Copag confirmado mais abaixo. `:""}Troque o tipo, a coleção ou a loja${F.stock?", ou mostre também ofertas sem estoque confirmado em Mais filtros":""}.</p><button class="btn ghost" type="button" id="clear">Limpar filtros</button></div>`
    :`<div class="empty"><h3>Nada para destacar ainda</h3><p>${F.mode==="guardar"?"Uma oferta entra aqui com estoque confirmado e preço Copag confirmado.":"Uma oferta entra aqui com estoque confirmado e quantidade de boosters conhecida."}</p></div>`;
  $("#view").innerHTML=`<div class="layout">
  <div class="side">${side}
    <p class="summary"><span><b>${OFF.filter(live).length}</b> ofertas em estoque</span><span><b>${stores}</b> lojas</span><span>Atualizado ${ago(S.generatedAt)}</span></p>
  </div>
  <div>
    ${filtersHTML(all)}
    ${list.length?`<div class="page-title"><h2>${F.mode==="abrir"?"Mais boosters pelo dinheiro":"Abaixo da Copag"}</h2><span>${list.length} ${list.length>1?"produtos":"produto"}</span></div>`:""}
    ${list.length>1?`<div class="binder">${list.slice(1).map(pocket).join("")}</div>`:list.length===1?`<p class="note">Só a oferta em destaque passa nos filtros.</p>`:""}
    ${noCopag.length?`<details class="more"${list.length?"":" open"}><summary>${ic("caret-down")}Sem preço Copag confirmado (${noCopag.length})</summary><p>Sem o preço sugerido não dá para medir desconto. Ficam fora do ranking até a Copag publicar o preço.</p><div class="binder">${sortEntries(noCopag).map(pocket).join("")}</div></details>`:""}
  </div>
</div>`;
  bindTilt();
}

function renderList(title,intro,list,emptyMsg){
  $("#view").innerHTML=`<div class="stack" style="margin-top:16px"><section class="panel"><h2>${title}</h2><p>${intro}</p>
  ${list.length?`<div class="tablewrap"><table><thead><tr><th>Produto</th><th>Loja</th><th class="r">Total</th><th>Situação</th></tr></thead><tbody>${list.map((o)=>{const p=P[o.productId]||{};return`<tr class="click" data-p="${esc(o.productId)}" tabindex="0"><td><b>${esc(p.collectionName)}</b><br><span style="color:var(--muted)">${esc(label(p))}</span></td><td>${esc(o.storeName)}</td><td class="r">${money(o.total)}</td><td>${o.anomalous?`<span class="chip bad">Preço anormal</span>`:stockChip(o)}</td></tr>`}).join("")}</tbody></table></div>`:`<p style="padding:0 16px 16px">${emptyMsg}</p>`}
  </section></div>`;
}
function renderReview(){
  const list=OFF.filter((o)=>o.anomalous||o.stock==="UNKNOWN");
  renderList("Revisar","Preço bom demais para ser verdade ou estoque que a loja não confirmou. Nada daqui entra no ranking nem dispara alerta.",list,"Nada para revisar.");
  const u=S.unmatched||[];
  $("#view .stack").insertAdjacentHTML("beforeend",`<section class="panel"><h2>Anúncios não identificados (${u.length})</h2><p>Títulos que o agente não conseguiu casar com um produto lacrado em português. Ficam fora por segurança.</p>${u.length?`<div class="tablewrap"><table><thead><tr><th>Título</th><th>Loja</th><th>Motivo</th></tr></thead><tbody>${u.slice(0,120).map((x)=>`<tr><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></td><td>${esc(x.store)}</td><td>${esc(x.why.join("; "))}</td></tr>`).join("")}</tbody></table></div>`:`<p style="padding:0 16px 16px">Nenhum.</p>`}</section>`);
}
function repoInfo(){const h=location.hostname.match(/^([^.]+)\.github\.io$/);const seg=location.pathname.split("/").filter(Boolean)[0];return h&&seg?{owner:h[1],repo:seg}:null}
function renderStores(){
  const src=(S.sources||[]).slice().sort((a,b)=>(a.status==="ACTIVE"?0:1)-(b.status==="ACTIVE"?0:1)||(b.matched||0)-(a.matched||0));
  const c=S.coverage||{};
  $("#view").innerHTML=`<div class="stack" style="margin-top:16px">
  <section class="panel"><h2>Adicionar loja</h2><p>O GitHub abre com a loja preenchida. Confirme em Commit changes e ela entra na próxima rodada.</p>
    <form class="addstore" id="addStore"><div class="field"><label for="storeUrl">Endereço da loja</label><input id="storeUrl" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="minhaloja.com.br"></div><button class="btn" type="submit">${ic("plus")}Adicionar</button><p class="msg" id="storeMsg" aria-live="polite"></p></form>
  </section>
  <p class="summary" style="margin:0 2px"><span><b>${c.active||0}</b> ativas</span><span><b>${c.blocked||0}</b> bloqueiam robôs</span><span><b>${c.error||0}</b> com erro</span><span><b>${c.pending||0}</b> sem endereço</span></p>
  <div class="store-list">${src.map((s)=>{const[cl,l]=SRC[s.status]||["",s.status];return`<div class="store"><b>${esc(s.name)}</b><span class="chip ${cl}">${l}</span><span class="why">${s.status==="ACTIVE"?`${s.matched??0} produtos identificados de ${s.listings??0} anúncios. Verificada ${ago(s.lastCheck)}.`:esc(s.reason||"")}</span></div>`}).join("")}</div></div>`;
  $("#addStore").onsubmit=(e)=>{e.preventDefault();const r=repoInfo();const raw=$("#storeUrl").value.trim();const msg=$("#storeMsg");
    let u;try{u=new URL(/^https?:\/\//i.test(raw)?raw:"https://"+raw)}catch{u=null}
    if(!u||!/\.[a-z]{2,}$/i.test(u.hostname)){msg.textContent="Endereço inválido. Use algo como minhaloja.com.br.";return}
    const host=u.hostname.replace(/^www\./,"").toLowerCase();
    const known=(S.sources||[]).find((s)=>{try{return s.url&&new URL(s.url).hostname.replace(/^www\./,"").toLowerCase()===host}catch{return false}});
    if(known){msg.textContent=`${host} já está na lista.`;return}
    if(!r){msg.textContent=`Adicione ${host} numa linha nova de config/lojas.txt.`;return}
    window.open(`https://github.com/${r.owner}/${r.repo}/new/main/config/lojas?filename=${encodeURIComponent(host+".txt")}&value=${encodeURIComponent(u.origin+"\n")}`,"_blank","noopener");
    msg.textContent=`O GitHub abriu com ${host}. Toque em Commit changes para confirmar.`};
}
function renderAlerts(){
  const rules=S.rules||[];const a=S.recentAlerts||[];
  $("#view").innerHTML=`<div class="stack" style="margin-top:16px">
  <section class="panel"><h2>Regras ativas</h2><p>Avisam no Telegram e no celular. Toda regra exige estoque confirmado e produto identificado.</p>${rules.map((r)=>`<div class="rule">${ic("bell")}<span>${esc(r.label)}</span></div>`).join("")||`<p style="padding:0 16px 16px">Nenhuma regra.</p>`}</section>

}

/* Ficha do produto com todas as lojas */

  const c=p.copag||{};
  const src=c.confidence==="CATALOGO_COPAG"?"catálogo Copag ao varejo":c.source_url&&/copagloja/.test(c.source_url)?"loja oficial Copag":"cadastro com fonte Copag";

  <div class="sh-head" style="--ec:${gg.c}">${photo(p,offers[0])}<div><h2 id="sh-title">${esc(p.collectionName)}</h2><p>${esc(label(p))}</p></div><button class="iconbtn" type="button" data-close aria-label="Fechar">${ic("x")}</button></div>
  <div class="sh-scroll">
    <div class="facts">
      <div class="fact"><span>Preço Copag</span><b>${p.copagConfirmed?money(p.msrp):"Não confirmado"}</b>${p.copagConfirmed?`<small>${c.source_url?`<a href="${esc(c.source_url)}" target="_blank" rel="noopener">${src}</a>`:src}</small>`:""}</div>
      <div class="fact"><span>Média das lojas</span><b>${money(p.marketAverage)}</b></div>
      <div class="fact"><span>Menor já visto</span><b>${money(p.lowestHistorical?.total)}</b>${p.lowestHistorical?`<small>${ago(p.lowestHistorical.at)}</small>`:""}</div>
    </div>
    ${offers.map((o)=>`<div class="offer">
      <span class="st">${esc(o.storeName)}${o.seller&&o.seller!==o.storeName?` <span class="dt">(${esc(o.seller)})</span>`:""}</span>
      <span class="pr">${money(o.total)}</span>
      <span class="dt">${o.priceKind==="pix"?"Pix":"Preço da loja"}${o.shipping===0?", frete grátis":o.shipping>0?`, frete ${money(o.shipping)}`:", sem frete"}${o.perBooster?`, ${money(o.perBooster)} por booster`:""}</span>
      <span class="dt r">${o.discount!=null&&!o.anomalous?(Math.abs(o.discount)<.0005?"Preço Copag":o.discount>0?`-${pct(o.discount)} vs Copag`:`+${pct(-o.discount)} vs Copag`):""}</span>
      <div class="act">${o.anomalous?`<span class="chip bad">Preço anormal</span>`:stockChip(o)}${o.dealScore!=null?`<span class="chip">Deal Score ${o.dealScore}, ${TIER[o.classification?.tier]||""}</span>`:""}${o.stale?`<span class="chip warn">Leitura antiga</span>`:""}<a class="btn ${live(o)?"":"ghost"}" style="margin-left:auto;padding:9px 14px;font-size:14px" href="${esc(o.url)}" target="_blank" rel="noopener">Ver na loja ${ic("arrow-square-out")}</a></div>
    </div>`).join("")}
    <p class="note">Total = preço${offers.some((o)=>o.priceKind==="pix")?" no Pix quando a loja informa":""} mais frete calculado para o seu CEP quando a loja permite. Verificado ${ago(offers[0]?.source_timestamp)}.</p>
  </div>`;
  if(!sh.open)sh.showModal();
}

/* Brilho holográfico: segue o dedo ou o mouse, e a inclinação do celular */
let tiltRaf=0;
function setTilt(el,x,y){cancelAnimationFrame(tiltRaf);tiltRaf=requestAnimationFrame(()=>{el.style.setProperty("--mx",x.toFixed(3));el.style.setProperty("--my",y.toFixed(3));el.style.setProperty("--rx",((.5-y)*7).toFixed(2)+"deg");el.style.setProperty("--ry",((x-.5)*9).toFixed(2)+"deg")})}
function bindTilt(){
  const el=$("#tl");if(!el)return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  el.addEventListener("pointermove",(e)=>{const r=el.getBoundingClientRect();setTilt(el,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)});
  el.addEventListener("pointerleave",()=>setTilt(el,.5,.3));
}
if(window.DeviceOrientationEvent&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
  addEventListener("deviceorientation",(e)=>{const el=$("#tl");if(!el||e.gamma==null)return;const x=Math.min(1,Math.max(0,.5+e.gamma/60)),y=Math.min(1,Math.max(0,.3+(e.beta-40)/80));setTilt(el,x,y)},{passive:true});
}

function render(){
  document.querySelectorAll(".navbtn[data-go]").forEach((b)=>b.setAttribute("aria-current",b.dataset.go===view?"page":"false"));
  const seg=$("#seg");seg.dataset.v=view==="deals"?F.mode:"none";
  seg.querySelectorAll("button").forEach((b)=>b.setAttribute("aria-pressed",String(view==="deals"&&b.dataset.v===F.mode)));
  $(".seg .thumb").style.opacity=view==="deals"?1:0;
  $("#hint").textContent=view!=="deals"?"Volte para as ofertas tocando em um dos objetivos.":F.mode==="abrir"?"Boosters lacrados pelo menor preço por pacote, para abrir.":"Lacrados com o maior desconto sobre o preço sugerido Copag.";
  if(view==="deals")renderDeals();
  else if(view==="prevenda")renderList("Pré-venda","Produtos anunciados que ainda não chegaram. Não entram no ranking.",OFF.filter((o)=>o.stock==="PRE_ORDER"),"Nenhuma pré-venda encontrada nesta rodada.");
  else if(view==="revisar")renderReview();
  else if(view==="lojas")renderStores();
  else if(view==="alertas")renderAlerts();
}

function init(st){
  S=st;P=Object.fromEntries((S.products||[]).map((p)=>[p.id,p]));OFF=S.offers||[];
  const pre=OFF.filter((o)=>o.stock==="PRE_ORDER").length,rev=OFF.filter((o)=>o.anomalous||o.stock==="UNKNOWN").length;
  const cp=$("#c-pre"),cr=$("#c-rev");cp.hidden=!pre;cp.textContent=pre;cr.hidden=!rev;cr.textContent=rev;
  render();
}
function loading(){
  $("#view").innerHTML=`<div class="layout"><div class="skel" style="height:330px;border-radius:20px"></div><div><div class="skel" style="height:40px;border-radius:999px"></div><div class="binder" style="margin-top:16px">${'<div class="skel" style="height:250px"></div>'.repeat(6)}</div></div></div>`;
}
async function load(){
  loading();
  for(const u of ["./data/state.json","../data/state.json"]){try{const r=await fetch(u,{cache:"no-store"});if(r.ok)return init(await r.json())}catch{}}
  $("#view").innerHTML=`<div class="empty" style="margin-top:18px"><h3>Os dados ainda não chegaram</h3><p>O painel lê data/state.json, criado na primeira rodada do agente. Rode o Price Hunter na aba Actions do GitHub ou abra um arquivo de estado aqui.</p><label class="btn ghost">${ic("arrow-clockwise")}Abrir arquivo<input type="file" accept="application/json" id="file" class="sr"></label></div>`;
  $("#file").onchange=async(e)=>{try{init(JSON.parse(await e.target.files[0].text()))}catch{alert("Arquivo inválido.")}};
}

/* Eventos */
document.addEventListener("click",(e)=>{
  const t=e.target;
  const pb=t.closest("[data-p]");if(pb&&!t.closest("a")){openProduct(pb.dataset.p);return}
  const gb=t.closest(".fchip");if(gb){F.group=gb.dataset.g;store.set("f",F);renderDeals();return}
  const sb=t.closest(".seg button");if(sb){F.mode=sb.dataset.v;F.sort="";view="deals";store.set("f",F);render();return}
  const nb=t.closest(".navbtn[data-go]");if(nb){view=view===nb.dataset.go?"deals":nb.dataset.go;render();scrollTo({top:0});return}
  if(t.closest("#clear")){F.group="";F.col="";F.store="";store.set("f",F);renderDeals();return}
  if(t.closest("[data-close]"))$("#sheet").close();
});
document.addEventListener("keydown",(e)=>{if(e.key==="Enter"){const r=e.target.closest?.("tr[data-p]");if(r)openProduct(r.dataset.p)}});
document.addEventListener("change",(e)=>{const k=e.target.dataset?.f;if(!k)return;F[k]=e.target.type==="checkbox"?e.target.checked:e.target.value;store.set("f",F);renderDeals()});
$("#sheet").addEventListener("click",(e)=>{if(e.target===e.currentTarget)e.currentTarget.close()});
(function(){const t=store.get("theme",null);if(t)document.documentElement.dataset.theme=t;
  const dark=()=>document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const sync=()=>$("#theme use").setAttribute("href",dark()?"#i-sun":"#i-moon");sync();
  $("#theme").onclick=()=>{document.documentElement.dataset.theme=dark()?"light":"dark";store.set("theme",document.documentElement.dataset.theme);sync()}})();
load();
</script>
</body>
</html>
