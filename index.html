:root{
  --ground:#EDF1F8; --surface:#FFFFFF; --sunk:#E2E7F1; --ink:#131F49; --muted:#556079; --line:#D3DAE7;
  --cover:#1B2C74; --cover-2:#24398F; --cover-ink:#FFFFFF; --cover-muted:#C3CCEB;
  --sticker:#FFCF33; --sticker-ink:#2B2200;
  --ok:#0B7148; --ok-bg:#DAF2E5; --warn:#8F5200; --warn-bg:#FCEFD3; --bad:#AE2318; --bad-bg:#FBE1DE;
  --e-lightning:#E2A500; --e-fire:#E0512B; --e-water:#2C7BE5; --e-grass:#2F9A55; --e-psychic:#8E4BD6; --e-metal:#6E7A90;
  --shadow:0 1px 2px rgb(19 31 73 / .06), 0 6px 18px rgb(19 31 73 / .08);
  --shadow-lift:0 2px 4px rgb(19 31 73 / .08), 0 14px 34px rgb(19 31 73 / .16);
  --r-card:14px; --r-input:10px; --r-pill:999px;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --gutter:16px; --btn:#1B2C74; --btn-ink:#FFFFFF; --btn-hover:#24398F;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B1029; --surface:#151D42; --sunk:#0F1636; --ink:#EEF1FA; --muted:#A4AECC; --line:#27315D;
  --cover:#0F1840; --cover-2:#1A2558; --cover-ink:#FFFFFF; --cover-muted:#9FAAD3;
  --ok:#4CD49A; --ok-bg:#103A2C; --warn:#F2B451; --warn-bg:#3A2A0E; --bad:#FF8478; --bad-bg:#43191A;
  --e-lightning:#F5C431; --e-fire:#FF7A52; --e-water:#5EA2FF; --e-grass:#52C47B; --e-psychic:#B47CFF; --e-metal:#9AA6BC;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 22px rgb(0 0 0 / .28); --shadow-lift:0 2px 6px rgb(0 0 0 / .35), 0 18px 40px rgb(0 0 0 / .45); --btn:#FFCF33; --btn-ink:#231C00; --btn-hover:#FFDA5C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0B1029; --surface:#151D42; --sunk:#0F1636; --ink:#EEF1FA; --muted:#A4AECC; --line:#27315D;
  --cover:#0F1840; --cover-2:#1A2558; --cover-ink:#FFFFFF; --cover-muted:#9FAAD3;
  --ok:#4CD49A; --ok-bg:#103A2C; --warn:#F2B451; --warn-bg:#3A2A0E; --bad:#FF8478; --bad-bg:#43191A;
  --e-lightning:#F5C431; --e-fire:#FF7A52; --e-water:#5EA2FF; --e-grass:#52C47B; --e-psychic:#B47CFF; --e-metal:#9AA6BC;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 22px rgb(0 0 0 / .28); --shadow-lift:0 2px 6px rgb(0 0 0 / .35), 0 18px 40px rgb(0 0 0 / .45); --btn:#FFCF33; --btn-ink:#231C00; --btn-hover:#FFDA5C;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px}
body{margin:0;overflow-x:clip;background:var(--ground);color:var(--ink);font:400 16px/1.45 "Rubik",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100dvh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
::selection{background:var(--sticker);color:var(--sticker-ink)}
:focus-visible{outline:3px solid var(--e-water);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid var(--ground)}
.icon{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;fill:currentColor}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Capa do fichário */
.cover{background:var(--cover);color:var(--cover-ink);padding:calc(10px + env(safe-area-inset-top)) var(--gutter) 10px;position:relative;overflow:hidden}
.cover .pattern{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;color:#fff;opacity:.07}
.cover-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.brand{display:block;text-decoration:none;flex:none;line-height:0}
.brand img{height:112px;width:auto;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.cover-in{flex-wrap:wrap}
@media (max-width:640px){.brand{width:100%;display:flex;justify-content:center}.brand img{height:auto;width:min(300px,82vw)}.cover nav{margin:0 auto!important;width:100%;justify-content:space-between}.navbtn{padding:9px 10px}}
.fresh{position:relative;z-index:1;max-width:1240px;margin:8px auto 0;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--cover-muted)}
.fresh b{color:var(--cover-ink);font-weight:600}
.fresh .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 30%,transparent);flex:none}
.fresh.warn .dot{background:#F2B451;box-shadow:0 0 0 3px rgba(242,180,81,.3)}
.fresh.bad .dot{background:#FF8478;box-shadow:0 0 0 3px rgba(255,132,120,.3)}
@media (max-width:640px){.fresh{width:fit-content;max-width:100%;align-items:flex-start;margin-top:10px}.fresh .dot{margin-top:5px}}
.cover nav{margin-left:auto;display:flex;gap:4px}
.navbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--cover-ink);padding:9px 10px;border-radius:var(--r-pill);font-size:14px;font-weight:500;transition:background-color 160ms ease,transform 160ms var(--ease-out);position:relative}
.navbtn[aria-current="page"]{background:var(--cover-2)}
.navbtn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.navbtn:hover{background:var(--cover-2)}}
.navbtn .lbl{display:none}
.navbtn .count{position:absolute;top:3px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--sticker);color:var(--sticker-ink);font-size:11px;font-weight:700;line-height:17px;text-align:center}
@media (min-width:860px){.navbtn .lbl{display:inline}.navbtn .count{position:static;margin-left:2px}}

.wrap{max-width:1240px;margin:0 auto;padding:16px var(--gutter) calc(48px + env(safe-area-inset-bottom))}

/* Seletor principal */
.seg{max-width:520px;display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:var(--r-pill);padding:4px;position:relative;isolation:isolate}
.seg button{border:0;background:transparent;padding:10px 12px;border-radius:var(--r-pill);font-weight:600;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;transition:color 200ms ease,transform 160ms var(--ease-out);position:relative;z-index:1}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button:active{transform:scale(.97)}
.seg .thumb{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--surface);border-radius:var(--r-pill);box-shadow:var(--shadow);transition:transform 260ms var(--ease-out)}
.seg[data-v="abrir"] .thumb{transform:translateX(100%)}
.seg-hint{margin:8px 2px 0;font-size:13.5px;color:var(--muted)}

/* Layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"fbar" "side" "list";gap:18px;margin-top:16px}.layout>.fbar{grid-area:fbar}.layout>.side{grid-area:side}.layout>.list{grid-area:list}
.layout > *{min-width:0}
@media (min-width:1000px){.layout{grid-template-columns:380px minmax(0,1fr);grid-template-areas:"side fbar" "side list";grid-template-rows:auto 1fr;gap:18px 28px;align-items:start}.side{position:sticky;top:64px;grid-row:1 / span 2}}

/* Toploader holográfico (o destaque) */
.toploader{--mx:.5;--my:.3;--rx:0deg;--ry:0deg;position:relative;padding:5px;border-radius:20px;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform 220ms var(--ease-out);
  background:conic-gradient(from calc(var(--mx) * 360deg) at 50% 50%,#ff5f6d,#ffc371,#fff36b,#7cf29a,#53c7ff,#8a7bff,#ff6ad5,#ff5f6d);box-shadow:var(--shadow-lift)}
.toploader::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,rgb(255 255 255 / .75) 46%,transparent 62%);background-size:260% 100%;background-position:calc(var(--mx) * 100%) 0;mix-blend-mode:soft-light;pointer-events:none}
.tl-card{position:relative;background:var(--surface);border-radius:15px;padding:16px;overflow:hidden}
.tl-card::after{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at calc(var(--mx) * 100%) calc(var(--my) * 100%),rgb(255 255 255 / .55),transparent 45%);mix-blend-mode:overlay;pointer-events:none;opacity:.7}
.tl-top{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);font-weight:500;margin-bottom:12px}
.tl-top .score{margin-left:auto;font-weight:700;color:var(--ink)}
.tl-body{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:start}
.photo{aspect-ratio:1;border-radius:12px;background:#fff;overflow:hidden;display:grid;place-items:center;position:relative}
.photo img{width:100%;height:100%;object-fit:contain;padding:6px}
.photo.fallback{background:color-mix(in srgb,var(--ec) 16%,var(--surface));color:var(--ec)}
.photo.fallback .icon{width:42%;height:42%}
.pocket .photo.fallback .icon{width:34%;height:34%}
.tl-name{margin:0;font-size:21px;font-weight:800;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.tl-type{margin:3px 0 0;font-size:15px;color:var(--muted)}
.tl-price{display:flex;align-items:flex-end;flex-wrap:wrap;gap:4px 12px;margin-top:14px}
.big{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.02em}
.ref{font-size:14px;color:var(--muted)}
.ref s{text-decoration-thickness:1.5px}
.sticker{display:inline-flex;align-items:center;gap:5px;background:var(--sticker);color:var(--sticker-ink);font-weight:800;font-size:14px;padding:5px 10px 5px 8px;border-radius:6px 6px 6px 14px;transform:rotate(-2.5deg);box-shadow:0 1px 0 rgb(0 0 0 / .18);white-space:nowrap}
.sticker.muted{background:var(--sunk);color:var(--muted);transform:none;box-shadow:none;font-weight:600}
.tl-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tl-actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;padding:5px 10px;border-radius:var(--r-pill);background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.seal{background:var(--ink);color:var(--surface)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-pill);padding:12px 18px;font-weight:700;font-size:15px;text-decoration:none;background:var(--btn);color:var(--btn-ink);transition:transform 160ms var(--ease-out),background-color 160ms ease;white-space:nowrap}

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(v)=>v==null?"-":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pct=(v)=>v==null?"-":(v*100).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
const ago=(iso)=>{if(!iso)return"-";const m=Math.round((Date.now()-Date.parse(iso))/6e4);return m<1?"agora":m<60?`há ${m} min`:m<1440?`há ${Math.round(m/60)} h`:`há ${Math.round(m/1440)} d`};
const ic=(id,cls="icon")=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const store={get(k,d){try{const v=localStorage.getItem("ph:"+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem("ph:"+k,JSON.stringify(v))}catch{}}};

/* Cores de energia por grupo de produto */
const GROUP={Boosters:{icon:"lightning-f",c:"var(--e-lightning)"},ETB:{icon:"flame-f",c:"var(--e-fire)"},Blisters:{icon:"drop-f",c:"var(--e-water)"},Latas:{icon:"cylinder-f",c:"var(--e-metal)"},"Coleções":{icon:"sparkle-f",c:"var(--e-psychic)"},Baralhos:{icon:"leaf-f",c:"var(--e-grass)"}};
const GROUP_ORDER=["Boosters","ETB","Blisters","Coleções","Latas","Baralhos"];
const g=(p)=>GROUP[p?.group]||GROUP["Coleções"];
const TIER={exceptional:"Excepcional",excellent:"Excelente",verygood:"Muito bom",good:"Bom",normal:"Normal",ignore:"Fraco"};
const STOCK={IN_STOCK:["ok","Em estoque"],OUT_OF_STOCK:["","Sem estoque"],PRE_ORDER:["warn","Pré-venda"],UNKNOWN:["warn","Estoque não confirmado"],UNAVAILABLE:["","Indisponível"]};
const SRC={ACTIVE:["ok","Ativa"],BLOCKED:["bad","Bloqueia robôs"],ERROR:["bad","Com erro"],PENDING:["warn","Sem endereço"],UNAVAILABLE:["","Sem integração"],PAUSED:["","Pausada"]};

let S=null,P={},OFF=[];
const F=Object.assign({mode:"guardar",group:"",col:"",store:"",sort:"",stock:true,q:"",type:"",max:"",below:false},store.get("f",{}));
const norm=(t)=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const VIEWS=["pistas","copag","prevenda","revisar","lojas","alertas","guia"];
let view=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):"deals",xfOpen=false,fOpen=false;
function go(v){const h=v&&v!=="deals"?"#"+v:"";if(location.hash!==h){if(h)location.hash=h;else history.pushState(null,"",location.pathname+location.search)}view=v||"deals";if($("#more").open)$("#more").close();if($("#sheet").open)$("#sheet").close();try{$("#scorepop").hidePopover()}catch{}render();scrollTo({top:0})}
addEventListener("popstate",()=>{const v=location.hash.slice(1);view=VIEWS.includes(v)?v:"deals";render();scrollTo({top:0})});
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2400)}

function stockChip(o){const[c,l]=STOCK[o.stock]||["",o.stock];return`<span class="chip ${c}">${o.stock==="IN_STOCK"&&o.quantity?`${o.quantity} em estoque`:l}</span>`}
function photo(p,o,cls="photo"){
  const src=o?.image||p?.image;const gg=g(p);
  const fb=`<div class="${cls} fallback" style="--ec:${gg.c}" aria-hidden="true">${ic(gg.icon)}</div>`;
  if(!src)return fb;
  return`<div class="${cls}"><img src="${esc(src)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.closest('.photo').outerHTML=this.closest('.photo').dataset.fb" ></div>`.replace('<div class="'+cls+'">',`<div class="${cls}" data-fb="${esc(fb)}">`);
}
const live=(o)=>o.stock==="IN_STOCK"&&!o.stale&&!o.anomalous&&o.total>0;
const label=(p)=>p.typeLabel+(p.boosters&&(p.type==="booster_box"||p.type==="combo")?` ${p.boosters}`:"")+(p.variant?` ${p.variant}`:"");

/* Agrupa ofertas por produto e escolhe a melhor de cada um conforme o objetivo */
function entries(){
  const by={};
  for(const o of OFF){
    if(F.stock&&!live(o))continue;
    if(!F.stock&&(o.stale||o.anomalous||o.stock==="OUT_OF_STOCK"))continue;
    const p=P[o.productId];if(!p)continue;
    if(F.group&&p.group!==F.group)continue;
    if(F.col&&p.collection!==F.col)continue;
    if(F.store&&o.storeId!==F.store)continue;
    if(F.type&&p.type!==F.type)continue;
    if(F.max&&!(o.total<=Number(F.max)))continue;
    if(F.below&&!(o.discount>0))continue;
    if(F.q){const hay=norm([p.collectionName,p.series,p.typeLabel,p.variant,p.boosters?p.boosters+" boosters":"",o.title,o.storeName].join(" "));if(!norm(F.q).split(/\s+/).every((w)=>hay.includes(w)))continue}
    if(F.mode==="abrir"&&!o.perBooster)continue;
    (by[p.id]||=[]).push(o);
  }
  const key=F.mode==="abrir"?(o)=>o.perBooster:(o)=>o.total;

/* Por que essa nota: explica o Deal Score de uma oferta, critério por critério */
const CRIT=[
  ["copag",35,"Desconto sobre a Copag","Nota cheia a partir de 30% abaixo do preço sugerido oficial."],
  ["historico",15,"Perto do menor preço já visto","Compara com o menor preço que o robô já encontrou para esse produto."],
  ["porBooster",15,"Preço por booster","Compara com o booster mais barato da mesma coleção."],
  ["estoque",10,"Estoque confirmado","A loja confirma que tem o produto agora."],
  ["loja",10,"Confiança na loja","CNPJ, avaliações, tempo de mercado, política de troca e histórico."],
  ["frete",5,"Frete","Grátis vale nota cheia. Frete não calculado vale zero."],
  ["lacrado",5,"Certeza do produto","O título deixa claro que é lacrado e qual é o produto."],
  ["disponibilidade",5,"Quantidade","Mais de uma unidade disponível."]];
function scoreWhy(o){
  const p=P[o.productId]||{};const st=(S.sources||[]).find((x)=>x.id===o.storeId);const ev=st?.score?.evidence||[];
  const pr=o.scoreParts||{};const tier=TIER[o.classification?.tier]||"";
  const detail={copag:o.discount>0?`${pct(o.discount)} abaixo da Copag (${money(p.msrp)}).`:`Não está abaixo da Copag (${money(p.msrp)}).`,
    historico:p.lowestHistorical?`Menor preço já visto: ${money(p.lowestHistorical.total)}, ${ago(p.lowestHistorical.at)}.`:"Ainda sem histórico: nota média.",
    porBooster:o.perBooster?`${money(o.perBooster)} por booster.`:"Produto sem boosters contados: nota média.",
    loja:ev.length?`Encontrado: ${ev.join(", ")}.`:"Loja ainda sem informações de confiança cadastradas.",
    frete:o.shipping===0?"Frete grátis.":o.shipping>0?`Frete de ${money(o.shipping)}.`:"Frete não calculado: confira no carrinho.",
    lacrado:(pr.lacrado??0)>=5?"Título deixa claro que é lacrado e qual é o produto.":"O título não diz com todas as letras que é lacrado ou Copag. Confira na página da loja.",
    disponibilidade:o.quantity>1?`${o.quantity} unidades.`:"Quantidade não informada ou só uma."};
  const tips=[];
  if(!(o.shipping>=0))tips.push("O frete não entrou na conta. Simule no carrinho antes de decidir.");
  if(!o.storeValidated)tips.push("Loja com pouca informação de confiança. Confira CNPJ, avaliações e política de troca.");
  if(p.lowestHistorical&&o.total>p.lowestHistorical.total*1.1)tips.push(`Já foi visto por ${money(p.lowestHistorical.total)}. Talvez valha esperar.`);
  if(o.priceKind==="pix")tips.push("O preço considerado é no Pix.");
  const lead=o.discount>0?`${pct(o.discount)} abaixo do preço sugerido oficial da Copag${o.discount>=.2?", um desconto forte":""}.`:"Não está abaixo do preço sugerido oficial da Copag.";
  return`<div class="sp-head"><span class="sp-num">${o.dealScore}</span><span class="sp-tier">${esc(tier)}</span><button class="iconbtn" type="button" style="margin-left:auto" popovertarget="scorepop" popovertargetaction="hide" aria-label="Fechar">${ic("x")}</button></div>
  <p class="sp-why">${lead} A nota vai de 0 a 100 e soma os critérios abaixo.</p>
  ${CRIT.map(([k,max,name,help])=>{const v=pr[k]??0;const r=Math.max(0,Math.min(1,v/max));return`<div class="sp-row"><b>${name}</b><span>${Math.round(v)} de ${max}</span><span class="sp-bar"><i class="${r<.5?"low":""}" style="width:${Math.round(r*100)}%"></i></span><small>${esc(detail[k]||help)}</small></div>`}).join("")}
  ${tips.length?`<p class="sp-tip">${tips.map(esc).join(" ")}</p>`:""}
  <button class="sp-more" type="button" data-go="guia">Como o site avalia as ofertas</button>`;
}
function showScore(btn){
  const o=OFF.find((x)=>x.id===btn.dataset.score);if(!o)return;const pop=$("#scorepop");
  pop.innerHTML=scoreWhy(o);
  try{pop.showPopover()}catch{}
  if(innerWidth>=760){const r=btn.getBoundingClientRect();const w=pop.offsetWidth,h=pop.offsetHeight;
    let left=Math.min(Math.max(12,r.left+r.width/2-w/2),innerWidth-w-12);let top=r.bottom+8;if(top+h>innerHeight-12)top=Math.max(12,r.top-h-8);
    pop.style.left=left+"px";pop.style.top=top+"px"}
}
/* Alertas criados pelo site: abre o GitHub com o arquivo preenchido em config/alertas/ */
function alertBox(p,offers){
  const best=offers.filter(live).map((o)=>o.total)[0];
  const base=best||p.msrp||p.copagReference;const sug=base?Math.max(1,Math.floor(base*0.9/5)*5):"";
  const mine=(S.rules||[]).filter((r)=>r.filter?.productId===p.id);const ri=repoInfo();
  return`<div class="alertbox"><h3>${ic("bell")}Me avisa</h3>
  <div class="alrow"><div class="field"><label for="al-price">Quando custar até (R$)</label><input id="al-price" type="number" inputmode="decimal" min="1" step="5" value="${sug}"></div><button class="btn" type="button" data-alert="price" data-pid="${esc(p.id)}">Criar alerta</button></div>
  <button class="btn ghost" type="button" data-alert="stock" data-pid="${esc(p.id)}">${ic("package")}Avisar quando tiver em estoque</button>
  ${mine.length?`<ul>${mine.map((r)=>`<li>${ic("check-circle")}<span>${esc(r.label)}</span>${r.file&&ri?`<a class="rule-del" href="https://github.com/${ri.owner}/${ri.repo}/delete/main/${esc(r.file)}" target="_blank" rel="noopener">Apagar</a>`:""}</li>`).join("")}</ul>`:""}
  <p class="note">O GitHub abre com o alerta pronto. Toque em Commit changes e ele vale a partir da próxima rodada.</p></div>`;
}
function createAlert(kind,pid){
  const p=P[pid];if(!p)return;const ri=repoInfo();const name=`${p.collectionName} ${label(p)}`;
  let rule,file;
  if(kind==="price"){const v=Number(String($("#al-price")?.value||"").replace(",","."));if(!(v>0)){toast("Digite um preço válido.");$("#al-price")?.focus();return}
    rule={label:`${name} até ${money(v)}`,mode:"target",filter:{productId:pid},maxPrice:v};file=`${pid}-ate-${Math.round(v)}.json`}
  else{rule={label:`${name} voltou ao estoque`,restock:true,filter:{productId:pid}};file=`${pid}-estoque.json`}
  if(!ri){toast("Abra pelo endereço do GitHub Pages para criar alertas.");return}
  window.open(`https://github.com/${ri.owner}/${ri.repo}/new/main/config/alertas?filename=${encodeURIComponent(file)}&value=${encodeURIComponent(JSON.stringify(rule,null,2)+"\n")}`,"_blank","noopener");
  toast("GitHub aberto. Toque em Commit changes para confirmar.");
}
/* Ficha do produto com todas as lojas */
function openProduct(pid){
  const p=P[pid];if(!p)return;const gg=g(p);
  const offers=OFF.filter((o)=>o.productId===pid).sort((a,b)=>(live(b)-live(a))||(a.total??1e9)-(b.total??1e9));
  const c=p.copag||{};
  const src=c.confidence==="CATALOGO_COPAG"?"catálogo Copag ao varejo":c.source_url&&/copagloja/.test(c.source_url)?"loja oficial Copag":"cadastro com fonte Copag";
  const sh=$("#sheet");
  sh.innerHTML=`<div class="sh-grip" aria-hidden="true"></div>
  <div class="sh-head" style="--ec:${gg.c}">${photo(p,offers[0])}<div><h2 id="sh-title">${esc(p.collectionName)}</h2><p>${esc(label(p))}</p></div><button class="iconbtn" type="button" data-close aria-label="Fechar">${ic("x")}</button></div>
  <div class="sh-scroll">
    <div class="facts">
      <div class="fact"><span>Preço Copag</span><b>${p.copagConfirmed?money(p.msrp):"Sem preço oficial"}</b>${p.copagConfirmed?`<small>${c.source_url?`<a href="${esc(c.source_url)}" target="_blank" rel="noopener">${src}</a>`:src}</small>`:p.copagReference?`<small>Referência não oficial: ${money(p.copagReference)}</small>`:""}</div>
      <div class="fact"><span>Média das lojas</span><b>${money(p.marketAverage)}</b></div>
      <div class="fact"><span>Menor já visto</span><b>${money(p.lowestHistorical?.total)}</b>${p.lowestHistorical?`<small>${ago(p.lowestHistorical.at)}</small>`:""}</div>
    </div>
    ${alertBox(p,offers)}
    ${offers.map((o)=>`<div class="offer">
      <span class="st">${esc(o.storeName)}${o.seller&&o.seller!==o.storeName?` <span class="dt">(${esc(o.seller)})</span>`:""}</span>
      <span class="pr">${money(o.total)}</span>
      <span class="dt">${o.priceKind==="pix"?"Pix":"Preço da loja"}${o.shipping===0?", frete grátis":o.shipping>0?`, frete ${money(o.shipping)}`:", sem frete"}${o.perBooster?`, ${money(o.perBooster)} por booster`:""}</span>
      <span class="dt r">${o.discount!=null&&!o.anomalous?(Math.abs(o.discount)<.0005?"Preço Copag":o.discount>0?`-${pct(o.discount)} vs Copag`:`+${pct(-o.discount)} vs Copag`):""}</span>
      <div class="act">${o.anomalous?`<span class="chip bad">Preço anormal</span>`:stockChip(o)}${o.dealScore!=null?`<button class="chip scorebtn" type="button" data-score="${esc(o.id)}" aria-label="Deal Score ${o.dealScore}: por que essa nota?">Deal Score ${o.dealScore}, ${TIER[o.classification?.tier]||""}${ic("info")}</button>`:""}${o.stale?`<span class="chip warn">Leitura antiga</span>`:""}<a class="btn ${live(o)?"":"ghost"}" style="margin-left:auto;padding:9px 14px;font-size:14px" href="${esc(o.url)}" target="_blank" rel="noopener">Ver na loja ${ic("arrow-square-out")}</a></div>
    </div>`).join("")}
    <p class="note">Total = preço${offers.some((o)=>o.priceKind==="pix")?" no Pix quando a loja informa":""} mais frete calculado para o seu CEP quando a loja permite. Verificado ${ago(offers[0]?.source_timestamp)}.</p>
  </div>`;
  if(!sh.open)sh.showModal();
}

/* Brilho holográfico: segue o dedo ou o mouse, e a inclinação do celular */
let tiltRaf=0;
function setTilt(el,x,y){cancelAnimationFrame(tiltRaf);tiltRaf=requestAnimationFrame(()=>{el.style.setProperty("--mx",x.toFixed(3));el.style.setProperty("--my",y.toFixed(3));el.style.setProperty("--rx",((.5-y)*7).toFixed(2)+"deg");el.style.setProperty("--ry",((x-.5)*9).toFixed(2)+"deg")})}
function bindTilt(){
  const el=$("#tl");if(!el)return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  el.addEventListener("pointermove",(e)=>{const r=el.getBoundingClientRect();setTilt(el,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)});
  el.addEventListener("pointerleave",()=>setTilt(el,.5,.3));
}
if(window.DeviceOrientationEvent&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
  addEventListener("deviceorientation",(e)=>{const el=$("#tl");if(!el||e.gamma==null)return;const x=Math.min(1,Math.max(0,.5+e.gamma/60)),y=Math.min(1,Math.max(0,.3+(e.beta-40)/80));setTilt(el,x,y)},{passive:true});
}

function render(){
  const cur=view==="deals"?"":view;
  document.querySelectorAll("[data-go]").forEach((b)=>b.setAttribute("aria-current",b.dataset.go===cur?"page":"false"));
  const mb=document.querySelector(".tabbar [data-more]");if(mb)mb.setAttribute("aria-current",["prevenda","revisar","lojas","guia"].includes(view)?"page":"false");
  $("#seg").hidden=view!=="deals";$("#hint").hidden=view!=="deals";
  const seg=$("#seg");seg.dataset.v=view==="deals"?F.mode:"none";
  seg.querySelectorAll("button").forEach((b)=>b.setAttribute("aria-pressed",String(view==="deals"&&b.dataset.v===F.mode)));
  $(".seg .thumb").style.opacity=view==="deals"?1:0;
  $("#hint").textContent=view!=="deals"?"Volte para as ofertas tocando em um dos objetivos.":F.mode==="abrir"?"Boosters lacrados pelo menor preço por pacote, para abrir.":"Lacrados com o maior desconto sobre o preço sugerido Copag.";
  if(view==="deals")renderDeals();
  else if(view==="pistas")renderTips();
  else if(view==="copag")renderCopag();
  else if(view==="guia")renderGuide();
  else if(view==="prevenda")renderList("Pré-venda","Produtos anunciados que ainda não chegaram. Não entram no ranking.",OFF.filter((o)=>o.stock==="PRE_ORDER"),"Nenhuma pré-venda encontrada nesta rodada.");
  else if(view==="revisar")renderReview();
  else if(view==="lojas")renderStores();
  else if(view==="alertas")renderAlerts();
}

function fresh(){
  const el=$("#fresh");if(!S||!el)return;
  const m=(Date.now()-Date.parse(S.generatedAt))/6e4;const hora=new Date(S.generatedAt).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  el.className="fresh"+(m>90?" bad":m>30?" warn":"");
  $("#mini-t").innerHTML=`<b>${m>90?"Parado":"Atualizado"} ${ago(S.generatedAt)}</b>`;
  $("#fresh-t").innerHTML=m>90?`<b>Sem atualização ${ago(S.generatedAt)}</b> (às ${hora}). O robô pode estar parado.`:`<b>Atualizado ${ago(S.generatedAt)}</b>, às ${hora}. Busca nova a cada 15 min.`;
}
setInterval(fresh,30e3);
function init(st){
  S=st;P=Object.fromEntries((S.products||[]).map((p)=>[p.id,p]));OFF=S.offers||[];
  const pre=OFF.filter((o)=>o.stock==="PRE_ORDER").length,rev=OFF.filter((o)=>o.anomalous).length;
  const tp=(S.tips||[]).filter((x)=>x.productId&&!x.expired&&x.discount>=.15&&!x.anomalous).length;
  const setc=(cls,n)=>document.querySelectorAll(cls).forEach((el)=>{el.hidden=!n;el.textContent=n});
  setc(".c-tip",tp);setc(".c-pre",pre);setc(".c-rev",rev);setc(".c-more",rev);
  fresh();render();
}
function loading(){
  $("#view").innerHTML=`<div class="layout"><div class="skel" style="height:330px;border-radius:20px"></div><div><div class="skel" style="height:40px;border-radius:999px"></div><div class="binder" style="margin-top:16px">${'<div class="skel" style="height:250px"></div>'.repeat(6)}</div></div></div>`;
}
async function fetchState(){for(const u of ["./data/state.json","../data/state.json"]){try{const r=await fetch(u,{cache:"no-store"});if(r.ok)return await r.json()}catch{}}return null}
async function refresh(){
  const bs=document.querySelectorAll("[data-refresh]");bs.forEach((b)=>b.classList.add("spin"));
  const st=await fetchState();bs.forEach((b)=>b.classList.remove("spin"));
  if(!st){toast("Não consegui buscar os dados. Tente de novo.");return}
  const novo=!S||st.generatedAt!==S.generatedAt;init(st);toast(novo?"Dados novos carregados":"Já está atualizado. A próxima busca sai em até 15 min.");
}
async function load(){
  loading();
  const st=await fetchState();if(st)return init(st);
  $("#view").innerHTML=`<div class="empty" style="margin-top:18px"><h3>Os dados ainda não chegaram</h3><p>O painel lê data/state.json, criado na primeira rodada do agente. Rode o Price Hunter na aba Actions do GitHub ou abra um arquivo de estado aqui.</p><label class="btn ghost">${ic("arrow-clockwise")}Abrir arquivo<input type="file" accept="application/json" id="file" class="sr"></label></div>`;
  $("#file").onchange=async(e)=>{try{init(JSON.parse(await e.target.files[0].text()))}catch{alert("Arquivo inválido.")}};
}

/* Eventos */
document.addEventListener("click",(e)=>{
  const t=e.target;
  const sbn=t.closest(".scorebtn");if(sbn){showScore(sbn);return}
  const pb=t.closest("[data-p]");if(pb&&!t.closest("a")){openProduct(pb.dataset.p);return}
  const gb=t.closest(".fchip");if(gb){F.group=gb.dataset.g;F.type="";store.set("f",F);renderDeals();return}
  const sb=t.closest(".seg button");if(sb){F.mode=sb.dataset.v;F.sort="";view="deals";store.set("f",F);render();return}
  const nb=t.closest("[data-go]");if(nb){e.preventDefault();go(nb.dataset.go);return}
  if(t.closest("[data-home]")){e.preventDefault();go("");return}
  if(t.closest("[data-more]")){$("#more").showModal();return}
  if(t.closest("[data-refresh]")){refresh();return}
  if(t.closest("#ftoggle")){fOpen=!fOpen;renderDeals();return}
  const al=t.closest("[data-alert]");if(al){createAlert(al.dataset.alert,al.dataset.pid);return}
  if(t.closest("#clear")){F.group="";F.col="";F.store="";F.type="";F.max="";F.below=false;F.q="";store.set("f",F);renderDeals();return}
  if(t.closest("#clear-all")){Object.assign(F,{group:"",col:"",store:"",type:"",max:"",below:false,q:"",stock:true});store.set("f",F);renderDeals();return}
  if(t.closest("#q-clear")){F.q="";store.set("f",F);renderDeals();$("#f-q")?.focus();return}
  if(t.closest("[data-close]"))$("#sheet").close();
});
document.addEventListener("keydown",(e)=>{if(e.key==="Enter"){const r=e.target.closest?.("tr[data-p]");if(r)openProduct(r.dataset.p)}});
let qT=0,hT=0;
if(matchMedia("(hover:hover) and (pointer:fine)").matches){
  document.addEventListener("mouseover",(e)=>{const b=e.target.closest?.(".scorebtn");if(!b)return;clearTimeout(hT);hT=setTimeout(()=>showScore(b),250)});
  document.addEventListener("mouseout",(e)=>{const b=e.target.closest?.(".scorebtn");if(b&&!e.relatedTarget?.closest?.("#scorepop,.scorebtn"))clearTimeout(hT)});
}
document.addEventListener("toggle",(e)=>{if(e.target.id==="xf")xfOpen=e.target.open},true);
document.addEventListener("input",(e)=>{if(e.target.id!=="f-q")return;const v=e.target.value;clearTimeout(qT);qT=setTimeout(()=>{F.q=v;store.set("f",F);const pos=e.target.selectionStart;renderDeals();const el=$("#f-q");if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch{}}},180)});
document.addEventListener("change",(e)=>{if(e.target.id==="f-q")return;const k=e.target.dataset?.f;if(!k)return;F[k]=e.target.type==="checkbox"?e.target.checked:e.target.value;store.set("f",F);renderDeals()});
["#sheet","#more"].forEach((id)=>$(id).addEventListener("click",(e)=>{if(e.target===e.currentTarget)e.currentTarget.close()}));
$("#mini-img").style.backgroundImage=`url("${$(".brand img").src}")`;
new IntersectionObserver(([en])=>{const m=$("#mini");m.classList.toggle("show",!en.isIntersecting);m.setAttribute("aria-hidden",String(en.isIntersecting))},{threshold:0}).observe($(".cover"));
(function(){const t=store.get("theme",null);if(t)document.documentElement.dataset.theme=t;
  const dark=()=>document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const sync=()=>{document.querySelectorAll(".theme-btn use").forEach((u)=>u.setAttribute("href",dark()?"#i-sun":"#i-moon"));const l=document.querySelector(".theme-lbl");if(l)l.firstChild.textContent=dark()?"Tema claro":"Tema escuro"};sync();
  document.querySelectorAll(".theme-btn").forEach((b)=>b.onclick=()=>{document.documentElement.dataset.theme=dark()?"light":"dark";store.set("theme",document.documentElement.dataset.theme);sync()})})();
load();
