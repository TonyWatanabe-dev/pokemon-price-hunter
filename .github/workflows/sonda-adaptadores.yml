name: Sonda de adaptadores (só leitura)
# Roda o adaptador dedicado (VTEX/Shopify) uma vez nas lojas indicadas e compara com a leitura genérica atual.
# Não grava nada: sem push, sem banco, sem secrets. Resultado nas anotações da execução e no artefato sonda.json.
on:
  workflow_dispatch:
    inputs:
      lojas:
        description: 'id:plataforma separados por vírgula'
        required: true
        default: 'lifegeek:vtex,dalarancombr:vtex,omniversecombr:vtex,lojadrop1combr:vtex,gatogingado:vtex,metacardscombr:shopify'
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: npm ci --omit=dev --no-audit --no-fund --silent --ignore-scripts
      - name: Dados atuais (ramo data, só leitura)
        run: |
          git fetch --depth 1 origin data && git checkout FETCH_HEAD -- data
      - name: Sonda
        env: { LOJAS: '${{ inputs.lojas }}' }
        run: node tools/sonda-adaptadores.mjs data --lojas "$LOJAS" --json sonda.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: sonda, path: sonda.json, if-no-files-found: ignore }
