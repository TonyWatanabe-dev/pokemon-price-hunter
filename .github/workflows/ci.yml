# CI de PR: roda a suíte completa (npm test) em todo PR para a main.
# Sem secrets e só leitura: não publica, não faz deploy e não grava no repositório.
# Os testes de banco rodam num PostgreSQL descartável do próprio job (sem secrets, nunca o banco de produção).
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17   # mesma versão padrão do db-validate.yml
        env: { POSTGRES_PASSWORD: pw }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env: { TEST_DATABASE_URL: 'postgres://postgres:pw@localhost:5432/postgres' }
