# CI de PR: roda a suíte completa (npm test) em todo PR para a main.
# Sem secrets e só leitura: não publica, não faz deploy e não grava no repositório.
# Os testes de banco ficam pulados (sem TEST_DATABASE_URL), como no uso local.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npm test
