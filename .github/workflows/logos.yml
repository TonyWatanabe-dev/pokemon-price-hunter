name: "Logos das coleções (baixar para conferência)"
on:
  workflow_dispatch:
    inputs:
      pt_slugs: { description: 'Slugs das páginas pt-br (opcional)', required: false, default: '' }
      extra: { description: 'Arquivos extras: id=url separados por espaço', required: false, default: '' }
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/fetch-logos.mjs
        env: { PT_SLUGS: '${{ inputs.pt_slugs }}', EXTRA: '${{ inputs.extra }}' }
      - name: Publicar no ramo logos
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cd logos-out && git init -q -b logos && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm logos && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" logos
