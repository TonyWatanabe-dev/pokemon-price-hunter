name: Backup dos dados
# Marca o commit atual do ramo data com a etiqueta data-backup/AAAA-MM-DD (UTC) e apaga as etiquetas mais velhas que a
# retenção (variável BACKUP_RETENTION_DAYS, padrão 14; as 3 mais recentes nunca são apagadas). Ver docs/backup.md.
# O ramo data é reescrito a cada rodada (push -f, sem histórico): a etiqueta é o que mantém um retrato recuperável.
#
# LIGADO (decisão do proprietário, 15/10/2026): agendamento diário às 04:37 UTC (01:37 em Brasília), longe da rodada
# das 09:17. workflow_dispatch continua para rodar à mão ou pelo cron-job.org (repetir no mesmo dia não faz mal).
# A poda só apaga etiquetas data-backup/AAAA-MM-DD (tools/data-backup.mjs → planPrune); nenhuma outra ref é tocada.
on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
# contents: write é necessário só para criar e apagar as etiquetas data-backup/*. Nenhum secret é usado.
permissions:
  contents: write
# Grupo próprio (não espera o robô). Não há corrida com o push -f do robô: o script busca o ramo uma vez e marca o sha
# buscado, nunca o nome do ramo.
concurrency:
  group: data-backup
  cancel-in-progress: false
jobs:
  backup:
    # Só a partir da main: um disparo manual escolhendo outro ramo não marca nem apaga nada.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Marcar retrato do ramo data
        env:
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
        run: node tools/data-backup.mjs
