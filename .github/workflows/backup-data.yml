name: Backup dos dados
# Marca o commit atual do ramo data com a etiqueta data-backup/AAAA-MM-DD (UTC) e apaga as etiquetas mais velhas que a
# retenção (variável BACKUP_RETENTION_DAYS, padrão 14; as 3 mais recentes nunca são apagadas). Ver docs/backup.md.
# O ramo data é reescrito a cada rodada (push -f, sem histórico): a etiqueta é o que mantém um retrato recuperável.
# Disparo principal: cron-job.org uma vez por dia (workflow_dispatch). O agendamento abaixo é só reserva: o agendador do
# GitHub atrasa e pula execuções neste repositório.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
# Grupo próprio (não espera o robô). Não há corrida com o push -f do robô: o script busca o ramo uma vez e marca o sha
# buscado, nunca o nome do ramo.
concurrency:
  group: data-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Marcar retrato do ramo data
        env:
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
        run: node tools/data-backup.mjs
