name: Social acervo de fotos

# Acervo de fotos dos produtos para os cards (#690). Só manual e só leitura: baixa a foto real de cada produto,
# recorta o fundo (rembg) e publica as fotos + folhas de contato como artefato para revisão. Nada é gravado no repo:
# as fotos aprovadas entram em assets/social/produtos/ por PR.

on:
  workflow_dispatch:
    inputs:
      so:
        description: 'IDs de produto separados por vírgula (vazio = todos)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  acervo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dados atuais (ramo data)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: dados
          persist-credentials: false
      - name: Dependências (Pillow + rembg)
        run: |
          set -o pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check --progress-bar off 'pillow==12.3.0' 'rembg[cpu]==2.0.80' 2>&1 | tail -n 20
      - name: Gerar acervo
        env:
          SO: ${{ inputs.so }}
        run: |
          set -o pipefail
          set -- --state dados/data/state.json --saida "$RUNNER_TEMP/acervo"
          [ -n "$SO" ] && set -- "$@" --so "$SO"
          "$RUNNER_TEMP/venv/bin/python" tools/social-acervo.py "$@" | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acervo
          path: ${{ runner.temp }}/acervo/
          retention-days: 14
