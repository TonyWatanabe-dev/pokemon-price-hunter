name: Vigia do robô
# Vigia por estado (tools/watchdog.mjs + src/ops-watch.js): avisa no Telegram/ntfy quando o robô para, o banco
# deixa de sincronizar, o leitor da nota oficial falha ou o deploy de produção falha/fica preso, e avisa de novo
# quando volta ao normal. Sem aviso repetido: o que já foi avisado fica num "livro" guardado no cache do Actions.
# Disparo principal: cron-job.org a cada 15 min (workflow_dispatch; ver docs/vigia.md). O agendamento abaixo é só
# reserva: o agendador do GitHub atrasa e pula execuções neste repositório.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      teste:
        description: 'Só enviar uma mensagem de teste (não avalia nem muda o livro)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: watchdog
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      vigia: ${{ steps.resumo.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # Dados publicados e estado operacional do MESMO commit do ramo data (nunca um de cada rodada).
      - name: Ler dados publicados
        run: |
          mkdir -p wd
          if git fetch -q --depth 1 origin data; then
            git show FETCH_HEAD:data/state.json | jq -c '{generatedAt}' > wd/state.json || rm -f wd/state.json
            git show FETCH_HEAD:data/meta.json > wd/meta.json 2>/dev/null || rm -f wd/meta.json
          fi
      - name: Últimas rodadas do robô
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list -R "${{ github.repository }}" --workflow hunter.yml --limit 10 \
            --json databaseId,status,conclusion,createdAt,updatedAt,event > wd/runs.json || echo '[]' > wd/runs.json
          # Envio ao grupo do WhatsApp (só leitura): falha na leitura apaga o arquivo e a checagem é pulada.
          gh run list -R "${{ github.repository }}" --workflow social-whatsapp-auto.yml --limit 8 \
            --json databaseId,status,conclusion,createdAt,updatedAt,event > wd/wa-runs.json || rm -f wd/wa-runs.json
      # Último deploy de produção (integração Vercel → API de deployments do GitHub), só leitura. Falha na leitura
      # não derruba o Vigia: sem o arquivo, o deploy simplesmente não é verificado.
      - name: Último deploy de produção
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/deployments?environment=Production&per_page=1" --jq '.[0].id // empty') || id=''
          if [ -n "$id" ]; then
            gh api "repos/${{ github.repository }}/deployments/$id" --jq '{sha, created_at, environment}' > wd/deploy-d.json \
              && gh api "repos/${{ github.repository }}/deployments/$id/statuses?per_page=10" --jq '[.[] | {state, created_at}]' > wd/deploy-s.json \
              && jq -n --slurpfile d wd/deploy-d.json --slurpfile s wd/deploy-s.json '{deployment: $d[0], "statuses": $s[0]}' > wd/deploy.json \
              || rm -f wd/deploy.json
          fi
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wd/ledger.json
          key: watchdog-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: watchdog-ledger-
      - name: Avaliar e avisar
        env:
          VIGIA_RESUMO: wd/vigia.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TESTE: ${{ inputs.teste }}
        run: |
          if [ "$TESTE" = "true" ]; then node tools/watchdog.mjs --test; exit 0; fi
          node tools/watchdog.mjs --state wd/state.json --meta wd/meta.json --runs wd/runs.json --ledger wd/ledger.json --deploy wd/deploy.json --wa-runs wd/wa-runs.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && hashFiles('wd/ledger.json') != ''
        continue-on-error: true
        with:
          path: wd/ledger.json
          key: watchdog-ledger-${{ github.run_id }}-${{ github.run_attempt }}
      # Resumo da checagem (estado, anterior, motivos e fatos; nenhum segredo) para o job de incidente.
      - name: Exportar resumo
        id: resumo
        if: always()
        run: |
          if [ -f wd/vigia.json ]; then echo "json=$(jq -c . wd/vigia.json)" >> "$GITHUB_OUTPUT"; fi

  # Issue de incidente com diagnóstico (src/ops-incident.js): cria, comenta quando os problemas mudam e fecha depois
  # de 2 checagens saudáveis. Idempotente e só sobre a própria issue (autor = bot + marcador). Desligado por padrão:
  # roda só com a variável do repositório VIGIA_ISSUES == 'true'. Único job com escrita, e só em issues.
  incidente:
    needs: check
    if: always() && vars.VIGIA_ISSUES == 'true' && needs.check.outputs.vigia != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Registrar incidente
        env:
          GH_TOKEN: ${{ github.token }}
          VIGIA_JSON: ${{ needs.check.outputs.vigia }}
        run: node tools/vigia-incidente.mjs
