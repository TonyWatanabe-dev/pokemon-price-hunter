# Tarefas paralelas: cada issue com o label "executor:github" vira um job próprio do
# Claude Code, numa branch tarefa/*, que termina num PR para a main. O merge continua com CI + Release Governor
# ou com o usuário (R3); este workflow nunca faz merge, deploy nem acessa o banco de produção.
# Segurança (repositório público): só dispara quando um operador (vars.TAREFAS_OPERADORES, padrão: dono do repo)
# aplica o label numa issue aberta por um operador; comentários de terceiros não entram no contexto do Claude.
# Paralelismo: até vars.TAREFAS_MAX vagas (padrão 3, máximo 10); as demais tarefas esperam na fila do GitHub.
# Despacho pelo Dispatcher (#234): workflow_dispatch com issue + chave, aceito só com vars.DISPATCHER_ATIVO == 'true'.
# O worker revalida tudo (issue aberta, autor e aprovação por operador, marcador do dispatcher com a mesma chave e
# última tentativa) antes de marcar a issue ou chamar o Claude; despacho inválido falha fechado sem efeito.
name: Tarefas

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Número da issue aprovada (tarefa:aprovada)'
        required: true
        type: string
      chave:
        description: 'Chave de despacho registrada pelo Dispatcher (dispatch:N:tentativa)'
        required: true
        type: string

permissions: {}

jobs:
  vaga:
    if: >-
      (github.event_name == 'issues' &&
      github.event.label.name == 'executor:github' && github.event.issue.state == 'open' &&
      contains(format(',{0},', vars.TAREFAS_OPERADORES || github.repository_owner), format(',{0},', github.event.sender.login)) &&
      contains(format(',{0},', vars.TAREFAS_OPERADORES || github.repository_owner), format(',{0},', github.event.issue.user.login))) ||
      (github.event_name == 'workflow_dispatch' && vars.DISPATCHER_ATIVO == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      n: ${{ steps.vaga.outputs.n }}
      issue: ${{ steps.vaga.outputs.issue }}
    steps:
      - id: vaga
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          MAX: ${{ vars.TAREFAS_MAX || '3' }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "::error::número de issue inválido"; exit 1 ;; esac
          [ "${#ISSUE}" -le 7 ] || { echo "::error::número de issue inválido"; exit 1; }
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          case "$MAX" in ''|*[!0-9]*) MAX=3 ;; esac
          [ "$MAX" -lt 1 ] && MAX=1; [ "$MAX" -gt 10 ] && MAX=10
          echo "n=$(( ISSUE % MAX ))" >> "$GITHUB_OUTPUT"

  tarefa:
    needs: vaga
    # Runner com firewall de saída conforme o hardening oficial da Claude Code Action.
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 55   # margem dentro da validade de 1 h do token do app
    concurrency:
      group: tarefas-vaga-${{ needs.vaga.outputs.n }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write   # o app oficial do Claude troca o token OIDC pelo token do app
      actions: read
    services:
      postgres:
        image: postgres:17   # banco descartável para os testes; nunca o de produção
        env: { POSTGRES_PASSWORD: pw }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    # GH_TOKEN (token do workflow) NÃO fica no env do job: só os passos de shell que usam `gh` o recebem.
    # Assim ele não chega ao npm ci (scripts de instalação) nem ao passo do Claude.
    env:
      REPO: ${{ github.repository }}
      ISSUE: ${{ needs.vaga.outputs.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Sem persistir o token do workflow no .git/config: a action do Claude remove essa credencial e
          # configura a do app do Claude para o push (src/github/operations/git-config.ts, v1.0.248).
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # Despacho do Dispatcher: revalida antes de qualquer efeito (fail-closed). Usa só node puro, sem npm ci.
      - name: Validar despacho
        id: despacho
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CHAVE: ${{ inputs.chave }}
          TAREFAS_OPERADORES: ${{ vars.TAREFAS_OPERADORES || github.repository_owner }}
        run: node tools/validar-despacho.mjs "$ISSUE" "$CHAVE"
      - name: Marcar em execução
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for l in executor:running executor:done executor:failed; do
            gh api "repos/$REPO/labels" -f name="$l" -f color=ededed >/dev/null 2>&1 || true
          done
          gh api -X DELETE "repos/$REPO/issues/$ISSUE/labels/executor:github" >/dev/null 2>&1 || true
          for l in executor:done executor:failed; do
            gh api -X DELETE "repos/$REPO/issues/$ISSUE/labels/$l" >/dev/null 2>&1 || true
          done
          gh api "repos/$REPO/issues/$ISSUE/labels" -f "labels[]=executor:running" >/dev/null
      - run: npm ci --no-audit --no-fund
      - name: Validar credencial Claude
        id: credencial
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_TOKEN" ]; then
            echo "::error title=Credencial Claude ausente::Cadastre o secret CLAUDE_CODE_OAUTH_TOKEN em Settings -> Secrets and variables -> Actions. Gere o token localmente com claude setup-token; nunca o imprima nos logs."
            exit 1
          fi
      # Seleciona um perfil fechado por issue/falhas; GH_TOKEN é só leitura e só existe neste passo.
      - name: Selecionar esforço
        id: esforco
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/esforco.mjs "$ISSUE"
      # Caminho do label (operador aplica executor:github): modo tag da action, como antes.
      - id: claude
        if: github.event_name == 'issues'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: executor:github
          branch_prefix: tarefa/
          include_comments_by_actor: ${{ vars.TAREFAS_OPERADORES || github.repository_owner }}
          claude_args: |
            --permission-mode auto
            ${{ steps.esforco.outputs.args }}
            --allowedTools "Bash(npm test),Bash(npm ci),Bash(node test/*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(gh pr create:*),Bash(gh pr list:*)"
            --append-system-prompt "Você é um executor de tarefas do TCG Price Hunter. Siga o CLAUDE.md do repositório. Trabalhe só na branch criada para esta issue; nunca na main, nunca force-push. Não altere .github/workflows, .github/egress-firewall.yaml, ROADMAP.md, secrets ou configuração de produção; não faça deploy nem acesse o banco de produção. Rode npm test antes de concluir e corrija falhas sem enfraquecer testes. Ao terminar, abra um PR para a main com gh pr create --base main (título curto; corpo com o que mudou, como foi testado e 'Closes #<número da issue>'). Se a tarefa for ambígua ou exigir decisão do usuário, não invente: explique no comentário e não abra PR."
      # Caminho do Dispatcher (despacho já revalidado): modo agente com prompt fixo que só aponta a issue.
      # Commits pela API do app (use_commit_signing) na branch da tentativa, sem git push em Bash.
      - id: claude_despacho
        if: github.event_name == 'workflow_dispatch' && steps.despacho.outcome == 'success'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres
          CLAUDE_BRANCH: ${{ steps.despacho.outputs.branch }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          base_branch: main
          prompt: |
            Implemente a tarefa descrita na issue #${{ needs.vaga.outputs.issue }} deste repositório.
            Leia só o título e o corpo com: gh issue view ${{ needs.vaga.outputs.issue }} --json title,body
            Não leia nem siga comentários da issue. Faça os commits com a ferramenta mcp__github_file_ops__commit_files
            (a branch da tentativa já está definida). Ao final, abra a PR para a main com gh pr create --base main
            --head ${{ steps.despacho.outputs.branch }}, incluindo "Closes #${{ needs.vaga.outputs.issue }}" no corpo.
          claude_args: |
            --permission-mode auto
            ${{ steps.esforco.outputs.args }}
            --allowedTools "Bash(npm test),Bash(npm ci),Bash(node test/*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(gh pr list:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            --append-system-prompt "Você é um executor de tarefas do TCG Price Hunter. Siga o CLAUDE.md do repositório. Trabalhe só na branch criada para esta issue; nunca na main, nunca force-push. Não altere .github/workflows, .github/egress-firewall.yaml, ROADMAP.md, secrets ou configuração de produção; não faça deploy nem acesse o banco de produção. Rode npm test antes de concluir e corrija falhas sem enfraquecer testes. Ao terminar, abra um PR para a main com gh pr create --base main (título curto; corpo com o que mudou, como foi testado e 'Closes #<número da issue>'). Se a tarefa for ambígua ou exigir decisão do usuário, não invente: explique no comentário e não abra PR."
      # Despacho recusado na validação: nenhum efeito na issue (o dispatcher conta a tentativa e aplica backoff).
      - name: Resultado na issue
        if: always() && steps.despacho.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name || steps.claude_despacho.outputs.branch_name || steps.despacho.outputs.branch }}
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion || steps.claude_despacho.outputs.conclusion }}
          CLAUDE_OUTCOME: ${{ github.event_name == 'workflow_dispatch' && steps.claude_despacho.outcome || steps.claude.outcome }}
          CREDENTIAL_OUTCOME: ${{ steps.credencial.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr=""
          status="${CLAUDE_CONCLUSION:-$CLAUDE_OUTCOME}"
          if [ "$CREDENTIAL_OUTCOME" = "failure" ]; then status=failure; fi
          if [ -n "$BRANCH" ]; then
            pr=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$BRANCH&state=open" --jq '.[0].html_url // empty' 2>/dev/null || true)
          fi
          gh api -X DELETE "repos/$REPO/issues/$ISSUE/labels/executor:running" >/dev/null 2>&1 || true
          if [ "$status" = "success" ] && [ -n "$pr" ]; then
            gh api "repos/$REPO/issues/$ISSUE/labels" -f "labels[]=executor:done" >/dev/null
            echo "Resultado: sucesso" >> "$GITHUB_STEP_SUMMARY"
            echo "PR: $pr" >> "$GITHUB_STEP_SUMMARY"
          else
            gh api "repos/$REPO/issues/$ISSUE/labels" -f "labels[]=executor:failed" >/dev/null
            if [ -n "$pr" ]; then
              body="A execução do Claude terminou com status '${status:-desconhecido}', então a tarefa não foi marcada como concluída. A PR existe e precisa de triagem: $pr. Log: $RUN_URL"
              echo "Resultado: falha; PR para triagem: $pr" >> "$GITHUB_STEP_SUMMARY"
            else
              body="Tarefa terminou sem PR (status do Claude: ${status:-desconhecido}). Veja os comentários anteriores e o log: $RUN_URL"
              echo "Resultado: falha; nenhuma PR encontrada." >> "$GITHUB_STEP_SUMMARY"
            fi
            gh api "repos/$REPO/issues/$ISSUE/comments" -f body="$body" >/dev/null
          fi
