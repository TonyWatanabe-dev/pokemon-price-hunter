name: Social preview

# Prévia do MVP Social Media (#657, #560/#631): roda tools/social-preview.mjs em --dry-run sobre o data/state.json
# do repositório e sobe preview.md/preview.json como artefato. Só manual, só leitura: não publica, não usa secrets,
# não faz push nem chama Telegram/Instagram/WhatsApp.

on:
  workflow_dispatch:
    inputs:
      canal:
        description: 'Canal da prévia'
        type: choice
        options: [telegram, instagram]
        default: telegram

permissions:
  contents: read

concurrency:
  group: social-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Dados atuais (ramo data, publicado pelo robô a cada rodada)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: dados
          persist-credentials: false
      - name: Gerar prévia (dry-run)
        env:
          CANAL: ${{ inputs.canal }}
        run: |
          case "$CANAL" in telegram|instagram) ;; *) echo "::error::canal inválido"; exit 1 ;; esac
          node tools/social-preview.mjs --dry-run --canal "$CANAL" --state dados/data/state.json --saida "$RUNNER_TEMP/social-preview"
          cat "$RUNNER_TEMP/social-preview/preview.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: social-preview
          path: ${{ runner.temp }}/social-preview/
          retention-days: 7
