name: Diagnóstico de páginas
on:
  workflow_dispatch:
    inputs:
      urls: { description: 'URLs separadas por espaço', required: true }
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/dump-pages.mjs dump
        env: { DUMP_URLS: '${{ inputs.urls }}' }
      - name: Publicar no ramo diag
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cd dump && git init -q -b diag && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm diag && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" diag
