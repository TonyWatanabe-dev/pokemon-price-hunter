# Fila de revisão humana (docs/agentes.md). Só quem tem escrita no repositório dispara, e o autor
# (github.actor) precisa estar em REVIEW_OPERATORS. Não altera preço, score nem oportunidade:
# aprovar grava a decisão; "export" grava config/matching-overrides.json num branch review/overrides-*
# para PR (nunca direto na main), e o robô ignora o arquivo enquanto "enabled" não for ligado à mão.
name: Revisão
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação'
        type: choice
        options: [triage, list, approve, reject, dismiss, export]
        default: triage
      ids: { description: 'Ids (ex.: 12,15)', required: false }
      collection: { description: 'Aprovar: coleção (ex.: me05)', required: false }
      type: { description: 'Aprovar: tipo (ex.: booster_box, booster_pack, blister_1)', required: false }
      boosters: { description: 'Aprovar: quantidade de boosters', required: false }
      reason: { description: 'Motivo da decisão', required: false }
permissions:
  contents: write
concurrency:
  group: review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --omit=dev --no-audit --no-fund --silent
      - name: Migrações
        env: { DATABASE_URL: '${{ secrets.DATABASE_URL }}' }
        run: node tools/db-migrate.mjs
      - name: Executar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVIEW_ACTOR: ${{ github.actor }}
          REVIEW_OPERATORS: ${{ vars.REVIEW_OPERATORS || github.repository_owner }}
          IN_ACTION: ${{ inputs.action }}
          IN_IDS: ${{ inputs.ids }}
          IN_COLLECTION: ${{ inputs.collection }}
          IN_TYPE: ${{ inputs.type }}
          IN_BOOSTERS: ${{ inputs.boosters }}
          IN_REASON: ${{ inputs.reason }}
        run: |
          set -- "$IN_ACTION"
          case "$IN_ACTION" in
            approve) set -- approve "$IN_IDS" --collection "$IN_COLLECTION" --type "$IN_TYPE" --reason "$IN_REASON"
                     [ -n "$IN_BOOSTERS" ] && set -- "$@" --boosters "$IN_BOOSTERS" ;;
            reject|dismiss) set -- "$IN_ACTION" "$IN_IDS" --reason "$IN_REASON" ;;
          esac
          node tools/review.mjs "$@"
      # Nunca direto na main: merge na main publica em produção e exige PR, CI e aprovação (CLAUDE.md).
      - name: Salvar overrides (branch para PR)
        if: inputs.action == 'export'
        env:
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "price-hunter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add config/matching-overrides.json
          git diff --cached --quiet && { echo "Sem mudança."; exit 0; }
          b="review/overrides-${RUN_ID}"
          git switch -c "$b"
          git commit -m "revisão: overrides de matching $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin "$b"
          echo "Abra o PR para a main: https://github.com/${REPO}/compare/main...${b}?expand=1" | tee -a "$GITHUB_STEP_SUMMARY"
