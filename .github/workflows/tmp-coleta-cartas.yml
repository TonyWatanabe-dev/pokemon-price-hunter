name: tmp coleta cartas (temporário, não mesclar)
on:
  push:
    branches: [social/coleta-cartas]
    paths: [tools/tmp-cartas/pedido.json, tools/tmp-cartas/videos.json, tools/tmp-cartas/valores.py, tools/tmp-cartas/precos.py, tools/tmp-cartas/quadros.py, tools/tmp-cartas/render.json, tools/tmp-cartas/render.py, tools/tmp-cartas/blister.json, tools/tmp-cartas/blister_edita.py, tools/tmp-cartas/comp.json, tools/tmp-cartas/comp_edita.py, tools/tmp-cartas/comp_fala.json, tools/tmp-cartas/comp_voz.py, tools/tmp-cartas/palavras.py, tools/tmp-cartas/smoke.py, tools/tmp-cartas/dragonite.json, tools/tmp-cartas/fotos.py, tools/tmp-cartas/fino.json]
permissions:
  contents: write
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/tmp-cartas/coleta.py
        if: contains(github.event.head_commit.message, 'pedido')
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && python3 tools/tmp-cartas/videos.py
        if: contains(github.event.head_commit.message, 'videos')
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && python3 tools/tmp-cartas/valores.py
        if: contains(github.event.head_commit.message, 'valores')
      - run: python3 tools/tmp-cartas/precos.py
        if: contains(github.event.head_commit.message, 'precos')
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && python3 tools/tmp-cartas/quadros.py
        if: contains(github.event.head_commit.message, 'quadros')
      - run: sudo apt-get install -y -qq ffmpeg tesseract-ocr python3-numpy python3-pil >/dev/null && python3 tools/tmp-cartas/render.py ${{ contains(github.event.head_commit.message, 'render-so:') && '30A_poster_abertura 30A_hit_moltres' || '' }}
        if: contains(github.event.head_commit.message, 'render')
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q --break-system-packages faster-whisper && python3 tools/tmp-cartas/blister.py
        if: contains(github.event.head_commit.message, 'blister-analise')
      - run: sudo apt-get install -y -qq ffmpeg python3-numpy python3-pil >/dev/null && python3 tools/tmp-cartas/blister_edita.py > tmp-render/BD_log.txt 2>&1 || (tail -40 tmp-render/BD_log.txt; echo falhou >> tmp-render/BD_log.txt)
        if: contains(github.event.head_commit.message, 'blister-edita')
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q --break-system-packages faster-whisper && ENTRADA=tools/tmp-cartas/comp.json SAIDA=tmp-comp python3 tools/tmp-cartas/blister.py
        if: contains(github.event.head_commit.message, 'comp-analise')
      - run: sudo apt-get install -y -qq ffmpeg python3-numpy python3-pil >/dev/null && python3 tools/tmp-cartas/comp_edita.py > tmp-render/COMP_log.txt 2>&1 || (tail -40 tmp-render/COMP_log.txt; echo falhou >> tmp-render/COMP_log.txt)
        if: contains(github.event.head_commit.message, 'comp-edita')
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && python3 tools/tmp-cartas/comp_voz.py
        if: contains(github.event.head_commit.message, 'comp-voz')
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q --break-system-packages faster-whisper && python3 tools/tmp-cartas/palavras.py
        if: contains(github.event.head_commit.message, 'palavras')
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q --break-system-packages faster-whisper && ENTRADA=tools/tmp-cartas/dragonite.json SAIDA=tmp-dragonite python3 tools/tmp-cartas/blister.py && python3 tools/tmp-cartas/fotos.py
        if: contains(github.event.head_commit.message, 'drago-analise')
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && python3 tools/tmp-cartas/fino.py
        if: contains(github.event.head_commit.message, 'fino')
      - run: python3 tools/tmp-cartas/smoke.py
        if: contains(github.event.head_commit.message, 'smoke')
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A tmp-cartas tmp-videos tmp-valores tmp-precos tmp-quadros tmp-render tmp-blister tmp-comp tmp-dragonite 2>/dev/null; git commit -m "tmp: resultado da coleta" && git push
