name: Price Hunter
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: hunter
  cancel-in-progress: false
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      # Os dados ficam no ramo "data", reescrito a cada rodada (sem acumular histórico no Git).
      # Na primeira vez, se o ramo ainda não existir, usa os dados que estão no main.
      - name: Carregar dados
        run: |
          if git fetch --depth 1 origin data 2>/dev/null; then
            rm -rf data
            git checkout FETCH_HEAD -- data
            git reset -q
          fi
      # Intervalo mínimo entre rodadas (padrão 8 min desde a última gravação), mesmo que o gatilho
      # externo chame mais vezes: evita visitar as lojas sem parar.
      - name: Intervalo entre rodadas
        id: gap
        env:
          GAP: ${{ vars.HUNTER_MIN_GAP_MIN || '8' }}
        run: |
          last=$(git log -1 --format=%ct FETCH_HEAD 2>/dev/null || echo 0)
          age=$(( ($(date +%s) - last) / 60 ))
          if [ "${{ github.event.schedule }}" != "17 9 * * *" ] && [ "$age" -lt "$GAP" ]; then
            echo "Última rodada há ${age} min (mínimo ${GAP}). Pulando."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Descoberta e verificação Copag (diário)
        if: github.event.schedule == '17 9 * * *'
        run: npm run discover && npm run copag-check
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      - name: Renovar acesso ao Mercado Livre
        id: ml
        if: steps.gap.outputs.skip != 'true'
        env:
          ML_CLIENT_ID: ${{ vars.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: node tools/ml-token.mjs refresh
      # O token renovável do ML é de uso único: grava já, mesmo que a caça falhe depois.
      - name: Guardar acesso renovado
        if: steps.ml.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/push-data.sh
      # Dependências (pg) para a caça ler a nota oficial do Opportunity Engine antes dos alertas.
      # Se falhar, a caça roda igual: os alertas saem sem a linha da nota.
      - name: Instalar dependências (leitura da nota oficial)
        if: steps.gap.outputs.skip != 'true'
        continue-on-error: true
        run: npm ci --omit=dev --no-audit --no-fund --silent
      - name: Caçar preços
        if: steps.gap.outputs.skip != 'true'
        run: npm run hunt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # TLS verificado do PostgreSQL (docs/tls.md). Sem o Secret, conecta como antes (sem verificar) e avisa no log.
          PG_CA_CERT: ${{ secrets.PG_CA_CERT }}
          PG_TLS_STRICT: ${{ vars.PG_TLS_STRICT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_CLIENT_ID: ${{ vars.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          HUNTER_CEP: ${{ vars.HUNTER_CEP }}
      - name: Salvar dados (ramo data)
        if: steps.gap.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/push-data.sh
      # Marketplace Core: grava também no PostgreSQL (Supabase). Sem o Secret DATABASE_URL, pula.
      # Falha aqui nunca derruba o robô nem o site (os arquivos do ramo data continuam sendo a fonte do site).
      - name: Sincronizar com o banco
        if: steps.gap.outputs.skip != 'true'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PG_CA_CERT: ${{ secrets.PG_CA_CERT }}
          PG_TLS_STRICT: ${{ vars.PG_TLS_STRICT }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "Banco desligado (sem DATABASE_URL)."; exit 0; }
          npm install --omit=dev --no-audit --no-fund --silent
          node tools/db-migrate.mjs
          node tools/db-grants.mjs || true
          node tools/db-sync.mjs data
          node tools/db-import-references.mjs
          node tools/db-stats.mjs
          node tools/db-opportunity.mjs
      # Agentes (docs/agentes.md): só propõem revisões; preço, score e oportunidades já foram gravados acima.
      # Rodadas são serializadas (concurrency: hunter). Prazo curto e falha tolerada: nunca atrasa nem derruba a rodada.
      - name: Agentes (fila de revisão)
        if: steps.gap.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PG_CA_CERT: ${{ secrets.PG_CA_CERT }}
          PG_TLS_STRICT: ${{ vars.PG_TLS_STRICT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node tools/agents-run.mjs data
      # O main só recebe mudanças em config/ (descoberta de lojas e verificação Copag, no gatilho diário).
      # tools/push-config.sh: rebase SEM resolução automática. Se uma edição humana em config/ conflitar com a do
      # robô, a do robô é descartada (aviso no log) e a humana fica intacta; a do robô é refeita na próxima rodada diária.
      - name: Salvar configuração (se mudou)
        if: steps.gap.outputs.skip != 'true'
        run: |
          # os dados já foram para o ramo data; o main só recebe mudanças em config/
          git checkout -q -- data 2>/dev/null || true
          git clean -fdq data
          git config user.name "price-hunter-bot"
          git config user.email "bot@users.noreply.github.com"
          bash tools/push-config.sh origin main
      # Aviso imediato só na transição para falha: se a rodada concluída anterior também falhou, o aviso já saiu e
      # o vigia (watchdog.yml) lembra enquanto continuar. Erro ao consultar as rodadas = avisa (nunca silencia).
      - name: Avisar falha no Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          R=$(mktemp)
          timeout 30 gh run list -R "$GITHUB_REPOSITORY" --workflow hunter.yml --limit 10 \
            --json databaseId,status,conclusion,createdAt,updatedAt > "$R" 2>/dev/null || echo 'erro' > "$R"
          decision=$(node tools/failure-alert-gate.mjs --runs "$R" --current "$GITHUB_RUN_ID" || true)
          [ "$decision" = "skip" ] && exit 0
          curl -s --max-time 20 -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ TCG Price Hunter: a rodada falhou. Detalhes: ${RUN_URL}"
