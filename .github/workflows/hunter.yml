name: Price Hunter
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hunter
  cancel-in-progress: false
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Descoberta e verificação Copag (diário)
        if: github.event.schedule == '17 9 * * *'
        run: npm run discover && npm run copag-check
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      - name: Caçar preços
        run: npm run hunt
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          HUNTER_CEP: ${{ vars.HUNTER_CEP }}
      - name: Salvar dados
        run: |
          git config user.name "price-hunter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data config
          git diff --cached --quiet && exit 0
          git commit -m "hunt $(date -u +%Y-%m-%dT%H:%MZ)"
          # Se alguém (você ou outra rodada) gravou no repositório durante a rodada,
          # traz as mudanças e reaplica os dados novos por cima. Tenta até 3 vezes.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
