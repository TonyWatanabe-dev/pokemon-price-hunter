name: Price Hunter
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hunter
  cancel-in-progress: false
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Os dados ficam no ramo "data", reescrito a cada rodada (sem acumular histórico no Git).
      # Na primeira vez, se o ramo ainda não existir, usa os dados que estão no main.
      - name: Carregar dados
        run: |
          if git fetch --depth 1 origin data 2>/dev/null; then
            rm -rf data
            git checkout FETCH_HEAD -- data
            git reset -q
          fi
      # Intervalo mínimo entre rodadas (padrão 8 min desde a última gravação), mesmo que o gatilho
      # externo chame mais vezes: evita visitar as lojas sem parar.
      - name: Intervalo entre rodadas
        id: gap
        env:
          GAP: ${{ vars.HUNTER_MIN_GAP_MIN || '8' }}
        run: |
          last=$(git log -1 --format=%ct FETCH_HEAD 2>/dev/null || echo 0)
          age=$(( ($(date +%s) - last) / 60 ))
          if [ "${{ github.event.schedule }}" != "17 9 * * *" ] && [ "$age" -lt "$GAP" ]; then
            echo "Última rodada há ${age} min (mínimo ${GAP}). Pulando."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Descoberta e verificação Copag (diário)
        if: github.event.schedule == '17 9 * * *'
        run: npm run discover && npm run copag-check
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      - name: Caçar preços
        if: steps.gap.outputs.skip != 'true'
        run: npm run hunt
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          HUNTER_CEP: ${{ vars.HUNTER_CEP }}
      - name: Salvar dados (ramo data)
        if: steps.gap.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          D=$(mktemp -d)
          cp -r data "$D/"
          cd "$D"
          git init -q -b data
          git config user.name "price-hunter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -qm "dados $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
      - name: Salvar configuração (se mudou)
        if: steps.gap.outputs.skip != 'true'
        run: |
          # os dados já foram para o ramo data; o main só recebe mudanças em config/
          git checkout -q -- data 2>/dev/null || true
          git clean -fdq data
          git config user.name "price-hunter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add config
          git diff --cached --quiet && exit 0
          git commit -m "config $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
      - name: Avisar falha no Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ TCG Price Hunter: a rodada falhou. Detalhes: ${RUN_URL}"
