# Dispatcher da fila de tarefas (issue #234; src/agents/dispatcher.js, tools/dispatcher.mjs).
# Etapa 1: SÓ PLANEJA. Lê issues com o label "tarefa:aprovada" (aplicado por operador), dependências, PRs abertas,
# tarefas em curso, leases e vagas, e publica no resumo do job quem seria despachado. Não escreve em issues, não
# dispara o worker, não faz merge nem deploy e não usa secrets. Ligar o disparo exige uma entrada workflow_dispatch
# validada no tarefas.yml (mudança R3, com revisão humana) e trocar as permissões deste workflow.
name: Dispatcher

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: dispatcher
  cancel-in-progress: false

jobs:
  plano:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAREFAS_OPERADORES: ${{ vars.TAREFAS_OPERADORES || github.repository_owner }}
      TAREFAS_MAX: ${{ vars.TAREFAS_MAX || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Plano de despacho
        run: node tools/dispatcher.mjs --json plano.json
