# Dispatcher da fila de tarefas (issue #234; src/agents/dispatcher.js, tools/dispatcher.mjs).
# Por padrão SÓ PLANEJA (job "plano", somente leitura): lê issues com o label "tarefa:aprovada" (aplicado por
# operador), dependências, PRs abertas, tarefas em curso, leases e vagas, e publica no resumo quem seria despachado.
# Com vars.DISPATCHER_ATIVO == 'true' roda o job "despacho": grava o marcador de despacho na issue, aplica quarentena
# e dispara o worker (tarefas.yml, workflow_dispatch com issue + chave), que revalida tudo antes de agir.
# Nenhum dos dois faz merge, deploy ou usa secrets; o worker continua limitado a branch + PR.
# Orçamento: com vars.DISPATCHER_ORCAMENTO_USD, pausa quando o custo reportado pela telemetria do worker na janela
# (vars.DISPATCHER_ORCAMENTO_JANELA_H, padrão 24 h) atinge o limite; com limite definido, valor inválido ou telemetria ilegível também pausa.
# Teto de despachos: na mesma janela, no máximo vars.DISPATCHER_MAX_DESPACHOS_JANELA (padrão 60) despachos, contados
# pelos marcadores do próprio Dispatcher — vale mesmo sem custo reportado; leitura falhando ou valor inválido pausa.
# Gatilho: o cron do GitHub é melhor-esforço e, neste repositório, não disparou nenhuma vez em 4 h após a #243
# (o do Hunter rodou só ~6 vezes/dia). Por isso o Dispatcher também roda ao fim de cada "Vigia do robô", que o
# agendador externo dispara a cada 15 min. Só conta execução do Vigia na main; o cron fica como reserva.
name: Dispatcher

on:
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: ['Vigia do robô']
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dispatcher
  cancel-in-progress: false

jobs:
  plano:
    if: vars.DISPATCHER_ATIVO != 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAREFAS_OPERADORES: ${{ vars.TAREFAS_OPERADORES || github.repository_owner }}
      TAREFAS_MAX: ${{ vars.TAREFAS_MAX || '3' }}
      # Orçamento pela telemetria real do worker (custo reportado na janela); vazio = sem limite.
      DISPATCHER_ORCAMENTO_USD: ${{ vars.DISPATCHER_ORCAMENTO_USD }}
      DISPATCHER_ORCAMENTO_JANELA_H: ${{ vars.DISPATCHER_ORCAMENTO_JANELA_H }}
      # Teto de despachos na mesma janela, contado pelos marcadores do Dispatcher (vazio = 60; inválido pausa).
      DISPATCHER_MAX_DESPACHOS_JANELA: ${{ vars.DISPATCHER_MAX_DESPACHOS_JANELA }}
      DISPATCHER_POR_CICLO: ${{ vars.DISPATCHER_POR_CICLO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Plano de despacho
        run: node tools/dispatcher.mjs --json plano.json

  despacho:
    if: vars.DISPATCHER_ATIVO == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mínimo para despachar: comentar o marcador/aplicar quarentena (issues) e disparar o worker (actions).
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAREFAS_OPERADORES: ${{ vars.TAREFAS_OPERADORES || github.repository_owner }}
      TAREFAS_MAX: ${{ vars.TAREFAS_MAX || '3' }}
      # Orçamento pela telemetria real do worker (custo reportado na janela); vazio = sem limite.
      DISPATCHER_ORCAMENTO_USD: ${{ vars.DISPATCHER_ORCAMENTO_USD }}
      DISPATCHER_ORCAMENTO_JANELA_H: ${{ vars.DISPATCHER_ORCAMENTO_JANELA_H }}
      # Teto de despachos na mesma janela, contado pelos marcadores do Dispatcher (vazio = 60; inválido pausa).
      DISPATCHER_MAX_DESPACHOS_JANELA: ${{ vars.DISPATCHER_MAX_DESPACHOS_JANELA }}
      DISPATCHER_POR_CICLO: ${{ vars.DISPATCHER_POR_CICLO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Despachar tarefas aprovadas
        run: node tools/dispatcher.mjs --executar --json resultado.json
